name: Modernize CF Room UI

on:
  push:
    branches: [main]
    paths:
      - 'public/cf-room.html'
      - '.github/workflows/modernize-cf-room.yml'
      - '.cf-ui-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    if: ${{ !startsWith(github.event.head_commit.message, 'ui: apply modern CF Room') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply modern mobile-first UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/cf-room.html')
          s=p.read_text(encoding='utf-8')
          marker='/* CF BOSS MODERN UI v1 */'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          css=r'''<style id="cf-modern-ui">
          /* CF BOSS MODERN UI v1 */
          :root{--a:#a855f7;--a2:#ec4899;--glass:rgba(20,18,27,.82)}
          body{background:radial-gradient(700px 420px at 50% -15%,rgba(168,85,247,.18),transparent 62%),#08080c}
          .top{height:64px;padding:8px 12px;background:rgba(9,9,13,.86);border-bottom:1px solid rgba(255,255,255,.08)}
          .brand{font-size:16px;letter-spacing:-.02em}.brand small{font-size:9px;opacity:.72}
          .room{display:none!important}.tabs{display:none!important}
          .views{display:block!important}.view{display:none!important}.view.on{display:block!important}
          .chatview{height:100%;border:0!important}.chat{max-width:780px;padding:22px 14px 156px}
          .welcome{margin:16vh auto 0}.welcome .logo{width:76px;height:76px;border-radius:24px;box-shadow:0 20px 70px rgba(168,85,247,.22)}
          .welcome h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.04em}.welcome p{max-width:520px;margin:auto;line-height:1.7}
          .composer{padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(7,7,10,.96) 28%);border:0}
          .composerbox{max-width:780px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:var(--glass);box-shadow:0 18px 60px rgba(0,0,0,.35);padding:8px;backdrop-filter:blur(24px)}
          .inputrow{align-items:flex-end}.input{min-height:52px;font-size:16px;padding:11px 12px}.send{width:50px;height:50px;background:linear-gradient(135deg,#fff,#eee);box-shadow:0 7px 24px rgba(255,255,255,.12)}
          .tools{gap:3px;padding:2px 2px 0}.tool{font-size:11px;border:1px solid transparent;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.035)}.tool:hover{background:rgba(168,85,247,.12);color:#eee}
          #status{padding:5px 8px;font-size:9px;opacity:.72}
          .msg{margin:20px 0}.bubble{border-radius:20px;padding:13px 15px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
          .avatar{width:36px;height:36px}
          /* Keep powerful workspaces available to Boss, not as competing chat tabs. */
          .sandboxbox,.fleet{display:none}
          @media(min-width:900px){.views{display:block!important}.chat{max-width:900px}.composer{left:0;width:100%}}
          @media(max-width:520px){.top{height:58px}.brand{font-size:14px}.brand small{font-size:8px}.chat{padding:14px 10px 158px}.welcome{margin:12vh auto 0}.welcome .logo{width:68px;height:68px}.welcome h1{font-size:30px}.tools{overflow:hidden}.tool{padding:7px 8px}.tool:nth-child(2){display:none}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          # Replace the visible tab label in the hidden nav with a subtle single-workspace indicator.
          s=s.replace('<nav class="tabs"><button class="tab on" data-v="chat">💬 Chat</button><button class="tab" data-v="sandbox">🧪 Sandbox</button><button class="tab" data-v="fleet">🚗 CodingFleet</button></nav>', '<div class="tabs" aria-hidden="true"></div>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'CF Boss UI Bot'
          git config user.email 'actions@github.com'
          git add public/cf-room.html
          git diff --cached --quiet || git commit -m 'ui: apply modern CF Room mobile chat'
          git push
