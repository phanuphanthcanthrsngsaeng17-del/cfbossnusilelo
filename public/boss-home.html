<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>CF Bossnusilelo · Boss Home</title>
<style>
:root{--bg:#07070a;--panel:#111117;--panel2:#181820;--line:#2a2a34;--text:#f7f7fb;--muted:#9696a4;--a:#a855f7;--a2:#ec4899;--ok:#34d399;--shadow:0 22px 70px rgba(0,0,0,.42)}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(800px 480px at 50% -15%,rgba(168,85,247,.18),transparent 62%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(8,8,12,.82);backdrop-filter:blur(22px);z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 10px 32px rgba(168,85,247,.25)}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:2px}.grow{flex:1}.auto{display:flex;align-items:center;gap:7px;border:1px solid #3b2b50;background:#15111c;border-radius:999px;padding:8px 11px;font-size:11px;color:#ddd}.auto i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);font-size:20px;cursor:pointer}.chat{flex:1;min-height:0;overflow:auto;padding:24px 14px 178px}.stream{max-width:820px;margin:auto}.welcome{text-align:center;margin:12vh auto 0;max-width:650px}.hero{width:78px;height:78px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c026d3 55%,#ec4899);font-size:36px;box-shadow:0 20px 70px rgba(168,85,247,.2)}h1{font-size:clamp(30px,7vw,48px);letter-spacing:-.05em;margin:18px 0 8px}.welcome p{color:var(--muted);line-height:1.7;margin:0}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto}.quick button,.chip{border:1px solid var(--line);background:#111117;color:#ddd;border-radius:999px;padding:9px 13px;cursor:pointer}.quick button:hover,.chip:hover{border-color:#69459a;background:#17121f}.msg{display:flex;gap:10px;margin:20px 0}.msg.user{justify-content:flex-end}.avatar{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;flex:none;background:#22222a}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:88%}.bubble{padding:14px 16px;border-radius:20px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;background:linear-gradient(145deg,#15151c,#111117);border:1px solid #25252f;box-shadow:0 8px 28px rgba(0,0,0,.14)}.user .bubble{background:linear-gradient(145deg,#3b2266,#2b174b);border-color:#55328a}.meta{font-size:10px;color:var(--muted);margin:6px 8px}.composer{position:fixed;left:0;right:0;bottom:0;padding:9px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(7,7,10,.96) 26%);z-index:10}.box{max-width:820px;margin:auto;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:rgba(20,19,26,.86);backdrop-filter:blur(25px);box-shadow:var(--shadow);padding:8px}.row{display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:52px;max-height:170px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:11px 12px;line-height:1.55;font-size:16px}.send{width:50px;height:50px;border:0;border-radius:16px;background:#fff;color:#111;font-size:21px;cursor:pointer}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:6px;padding:4px 4px 0;overflow:hidden}.chip{font-size:10px;padding:7px 10px;background:rgba(255,255,255,.035);white-space:nowrap}.status{margin-left:auto;color:#8f8f9d;font-size:9px;white-space:nowrap}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(5px);display:none;align-items:flex-end;z-index:30}.sheet.open{display:flex}.panel{width:100%;max-width:560px;margin:auto auto 0;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;background:#111117;padding:16px;box-shadow:0 -20px 80px rgba(0,0,0,.5)}.panel h3{margin:0 0 5px}.panel p{color:var(--muted);font-size:12px;margin:0 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{border:1px solid var(--line);border-radius:16px;background:#17171f;color:var(--text);padding:14px;text-align:left;cursor:pointer}.action b{display:block;margin-bottom:4px}.action small{color:var(--muted)}.close{width:100%;margin-top:10px;height:42px;border:1px solid var(--line);border-radius:13px;background:#0d0d12;color:#ccc}.sandbox{display:none;margin:10px auto 0;max-width:820px;border:1px solid var(--line);border-radius:18px;background:#0d0d12;overflow:hidden}.sandbox.open{display:block}.sandboxbar{display:flex;gap:7px;padding:8px;border-bottom:1px solid var(--line)}.sandboxbar select,.sandboxbar button{height:34px;border:1px solid var(--line);border-radius:10px;background:#17171f;color:#eee;padding:0 10px}.code{width:100%;height:170px;border:0;outline:0;resize:vertical;background:#09090d;color:#e5e7eb;padding:12px;font:12px/1.55 ui-monospace,monospace}.out{margin:0;padding:10px;border-top:1px solid var(--line);min-height:60px;color:#bfc0cb;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}@media(max-width:520px){.top{height:58px;padding:7px 10px}.mark{width:36px;height:36px}.brand{font-size:14px}.brand small{font-size:8px}.auto{padding:7px 9px;font-size:10px}.icon{width:38px;height:38px}.chat{padding:15px 10px 170px}.welcome{margin:10vh auto 0}.hero{width:68px;height:68px;font-size:30px}.quick button{font-size:12px}.body{max-width:90%}.under .chip:nth-child(3){display:none}.status{display:none}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">💜</div><div>CF Bossnusilelo<small>Boss Home · Auto AI</small></div></div><div class="grow"></div><div class="auto"><i></i> Auto · Boss เลือกให้</div><button class="icon" id="toolsBtn" aria-label="เครื่องมือ">＋</button></header>
<main class="chat" id="chat"><div class="stream" id="stream"><div class="welcome"><div class="hero">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>คุยช่องเดียวพอครับ บอสจะเข้าใจ → วางแผน → เลือกโมเดล/เครื่องมือ → ลงมือ → ตรวจสอบ</p><div class="quick"><button data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button data-q="ช่วยสร้างระบบนี้ให้ใช้งานง่ายขึ้น">✨ ปรับให้สวย</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่เหมาะที่สุด">🧠 ตรวจโมเดล</button><button data-q="ทดสอบระบบ Sandbox ให้หน่อย">🧪 ทดสอบ</button></div></div></div></main>
<div class="composer"><div class="box"><div class="row"><textarea id="input" class="input" placeholder="บอกบอสว่าอยากทำอะไร…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><button class="chip" id="attach">📎 แนบ</button><button class="chip" id="web">🌐 Web</button><button class="chip" id="memory">🧠 Memory</button><span class="status" id="status">พร้อม · Auto</span></div></div></div>
</div>
<div class="sheet" id="sheet"><div class="panel"><h3>🔧 ความสามารถของ Boss</h3><p>ไม่ต้องเปิดห้องใหม่ — Boss เรียกใช้ความสามารถเหล่านี้จากแชทเดียว</p><div class="actions"><button class="action" id="sandboxBtn"><b>🧪 Sandbox</b><small>รันและทดสอบโค้ดจริง</small></button><button class="action" id="fleetBtn"><b>🚗 CodingFleet</b><small>Inspect → Plan → Build → Verify</small></button><button class="action" id="memoryBtn"><b>🧠 Memory</b><small>ดูบริบทต่อเนื่องของบ้าน</small></button><button class="action" id="routerBtn"><b>⚡ Model Router</b><small>ให้ Auto เลือกโมเดล</small></button></div><button class="close" id="close">ปิด</button></div></div>
<div class="sandbox" id="sandbox"><div class="sandboxbar"><select id="lang"><option value="71">Python 3</option></select><button id="run">▶ รัน</button><button id="hideSandbox">ปิด</button></div><textarea id="code" class="code">print("Hello from CF Sandbox")</textarea><pre id="out" class="out">ผลการรันจะแสดงตรงนี้…</pre></div>
<script>
const $=id=>document.getElementById(id),input=$('input'),send=$('send'),stream=$('stream'),chat=$('chat'),status=$('status');let history=[],busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){stream.innerHTML='';if(!history.length){stream.innerHTML='<div class="welcome"><div class="hero">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>คุยช่องเดียวพอครับ บอสจะเข้าใจ → วางแผน → เลือกโมเดล/เครื่องมือ → ลงมือ → ตรวจสอบ</p><div class="quick"><button data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button data-q="ช่วยสร้างระบบนี้ให้ใช้งานง่ายขึ้น">✨ ปรับให้สวย</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่เหมาะที่สุด">🧠 ตรวจโมเดล</button><button data-q="ทดสอบระบบ Sandbox ให้หน่อย">🧪 ทดสอบ</button></div></div>';bindQuick();return}history.forEach(m=>{const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML='<div class="avatar">'+(m.role==='user'?'พ':'💜')+'</div><div class="body"><div class="bubble">'+esc(m.content)+'</div><div class="meta">'+(m.role==='user'?'พี่นุ':'💜 Boss · '+(m.provider||'Auto'))+'</div></div>';stream.appendChild(e)});chat.scrollTop=chat.scrollHeight}
function bindQuick(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;ask()})}
async function ask(text){if(busy)return;const q=(text||input.value).trim();if(!q)return;busy=true;history.push({role:'user',content:q});render();input.value='';send.disabled=true;status.textContent='กำลังทำงาน…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-14),room:'living',who:'silelo',provider:'auto',model:'',opt:{lang:'th',len:'normal',mode:'agent'}})});const d=await r.json();history.push({role:'assistant',content:d.reply||d.error||'บอสยังตอบไม่ได้',provider:d.providerLabel||'Auto'});status.textContent=d.providerLabel?d.providerLabel+' · '+(d.model||'Auto'):'พร้อม · Auto';localStorage.setItem('cf_boss_home',JSON.stringify(history.slice(-120)));render()}catch(e){history.push({role:'assistant',content:'⚠️ '+e.message});status.textContent='เชื่อมต่อไม่ได้';render()}finally{busy=false;send.disabled=false;input.focus()}}
function load(){try{history=JSON.parse(localStorage.getItem('cf_boss_home')||'[]')}catch{history=[]}render()}
$('toolsBtn').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');$('fleetBtn').onclick=()=>{$('sheet').classList.remove('open');ask('ใช้ CodingFleet ทำงานนี้ให้ผมแบบ Inspect → Plan → Build → Run → Review → Verify แล้วสรุปผลให้ผม')};$('routerBtn').onclick=()=>{$('sheet').classList.remove('open');ask('ตรวจ Model Router ของบ้านและเลือกโมเดลที่เร็วและเหมาะกับงานโดยอัตโนมัติ')};$('memoryBtn').onclick=()=>{$('sheet').classList.remove('open');ask('สรุป Memory และบริบทสำคัญของบ้านที่ Boss ควรรู้ตอนนี้')};$('web').onclick=()=>ask('ใช้ Web ช่วยค้นข้อมูลที่จำเป็นสำหรับงานนี้ แล้วสรุปเฉพาะสิ่งที่ตรวจสอบได้จริง');$('memory').onclick=()=>ask('ใช้ Memory ของบ้านประกอบคำตอบนี้');$('attach').onclick=()=>alert('แนบไฟล์จะเชื่อมกับระบบ Files ของบ้านในขั้นถัดไป');$('sandboxBtn').onclick=()=>{$('sheet').classList.remove('open');$('sandbox').classList.add('open');chat.style.paddingBottom='370px'};$('hideSandbox').onclick=()=>{$('sandbox').classList.remove('open');chat.style.paddingBottom='178px'};$('run').onclick=async()=>{const o=$('out');o.textContent='กำลังรัน…';try{const r=await fetch('/api/sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:$('code').value,language_id:Number($('lang').value),stdin:''})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sandbox error');o.textContent=[d.stdout,d.stderr,d.compile_output,d.message].filter(Boolean).join('\n')||d.status?.description||'เสร็จแล้ว'}catch(e){o.textContent='⚠️ '+e.message}};send.onclick=()=>ask();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};load();
</script>
</body></html>
