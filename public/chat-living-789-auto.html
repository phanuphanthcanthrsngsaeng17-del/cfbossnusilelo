<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090c"><meta http-equiv="Cache-Control" content="no-store"><title>CF Boss · Living 789</title>
<style>
:root{--bg:#08080b;--panel:#121217;--line:#292933;--text:#f7f7fb;--muted:#92929f;--ok:#34d399;--a:#a855f7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:60px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #ffffff10;background:#09090de8;backdrop-filter:blur(18px);z-index:5}.brand{display:flex;align-items:center;gap:8px;font-weight:800}.mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899)}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:500}.grow{flex:1}.auto{display:flex;align-items:center;gap:6px;border:1px solid #3b2b50;background:#15111c;border-radius:999px;padding:6px 9px;font-size:10px}.auto i{width:6px;height:6px;border-radius:50%;background:var(--ok)}button{font:inherit}.icon,.crown{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);cursor:pointer}.chat{flex:1;overflow:auto;padding:12px 10px 150px}.stream{max-width:850px;margin:auto}.welcome{text-align:center;margin:9vh auto 0;max-width:650px}.hero{width:68px;height:68px;margin:auto;border-radius:21px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899);font-size:30px}.welcome h1{font-size:clamp(28px,7vw,44px);margin:15px 0 6px}.welcome p{color:var(--muted);line-height:1.6;margin:0}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:18px auto}.quick button,.action,.chip,.copy{border:1px solid var(--line);background:#111117;color:#ddd;border-radius:10px;padding:7px 10px;cursor:pointer}.msg{display:flex;gap:7px;margin:7px 0}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:#22222a}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:90%}.bubble{padding:9px 12px;border-radius:14px;line-height:1.52;white-space:pre-wrap;overflow-wrap:anywhere;background:#15151c;border:1px solid #25252f}.user .bubble{background:#3b2266;border-color:#55328a}.meta{font-size:9px;color:var(--muted);margin:2px 6px}.copy{margin:1px 6px 0;font-size:10px;padding:4px 7px}.attach{margin-top:6px;padding:7px 9px;border:1px solid #302b3b;border-radius:10px;background:#0e0e13;color:#c9c1d8;font-size:11px}.digital{margin:8px auto 10px;border:1px solid #3b2b50;background:#0e0e13;border-radius:14px;padding:9px}.digital-head{display:flex;justify-content:space-between;font-size:10px;color:#d8d8e1}.digits{font:700 clamp(22px,7vw,38px)/1.1 ui-monospace,monospace;letter-spacing:.08em;color:#e9d5ff;text-align:center;margin:5px 0}.stage{display:flex;gap:5px;overflow:auto}.stage span{white-space:nowrap;border:1px solid #25252e;border-radius:9px;padding:5px 7px;font-size:9px;color:#777}.stage .on{border-color:#6841a0;color:#eadcff;background:#181321}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 9px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08080c 25%);z-index:10}.box{max-width:850px;margin:auto;border:1px solid #34343e;border-radius:22px;background:#141419ef;backdrop-filter:blur(20px);padding:7px}.row{display:flex;gap:6px;align-items:flex-end}.input{flex:1;min-height:48px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 11px;line-height:1.5;font-size:16px}.send{width:46px;height:46px;border:0;border-radius:14px;background:#fff;color:#111;font-size:20px;cursor:pointer}.under{display:flex;gap:5px;align-items:center;overflow:auto;padding:3px}.status{margin-left:auto;color:#858591;font-size:9px;white-space:nowrap}.filelist{display:flex;gap:5px;overflow:auto;padding:3px}.filepill{white-space:nowrap;border:1px solid #302b3b;border-radius:9px;padding:5px 7px;font-size:9px;color:#cfc7dc}.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:30}.sheet.open{display:flex}.panel{width:100%;max-width:560px;margin:auto auto 0;background:#111117;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:15px}.panel h3{margin:0 0 4px}.panel p{color:var(--muted);font-size:11px;margin:0 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{text-align:left;padding:11px}.action b{display:block;margin-bottom:3px}.action small{color:var(--muted)}.keybox{margin-top:10px;padding:10px;border:1px solid #3b2b50;border-radius:13px;background:#0d0d12}.keyrow{display:flex;gap:6px}.keyrow input{flex:1;min-width:0;background:#08080b;border:1px solid #292933;border-radius:9px;color:#fff;padding:9px}.keyrow button{border:1px solid #5b3b82;background:#241533;color:#eadcff;border-radius:9px;padding:0 11px}.keyhint{font-size:9px;color:#777;margin-top:6px;line-height:1.5}.close{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:13px;background:#17171f;color:var(--text);padding:11px}@media(max-width:520px){.brand small{display:none}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">💜</div><div>CF Boss<small>Living · Auto Brain · 789</small></div></div><div class="grow"></div><div class="auto"><i></i> Auto · คิดเอง</div><button class="icon" id="tools">＋</button></header>
<main class="chat" id="chat"><div class="stream" id="stream"></div></main>
<div class="composer"><div class="box"><div id="filelist" class="filelist"></div><div class="row"><button class="crown" id="voice" title="เสียง">🎙️</button><textarea id="input" class="input" placeholder="คุยหรือสั่ง Boss ได้เลย…"></textarea><button id="send" class="send">↑</button></div><div class="under"><label class="chip">📎 ไฟล์/รูป<input id="files" type="file" multiple hidden></label><span class="chip" id="sandbox">🧪 Sandbox</span><span class="chip" id="fleet">⚙️ CodingFleet</span><span class="chip" id="run">▶️ Run/AUTO</span><span class="status" id="status">ออนไลน์ · Auto</span></div></div></div>
</div>
<div class="sheet" id="sheet"><div class="panel"><h3>🔧 เครื่องมือ</h3><p>บอสคุยปกติได้ ระบบจะคิดเองว่าเครื่องมือไหนจำเป็น</p><div class="actions"><button class="action" data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้"><b>👀 ตรวจบ้าน</b><small>วิเคราะห์และตรวจผล</small></button><button class="action" data-q="ใช้ Sandbox ทำงานนี้ให้"><b>🧪 Sandbox</b><small>ทดลอง/รันอย่างปลอดภัย</small></button><button class="action" data-q="ใช้ CodingFleet ทำงานนี้ให้"><b>⚙️ CodingFleet</b><small>ให้ระบบขับงานต่อเอง</small></button><button class="action" data-q="รันงานนี้แบบ AUTO แล้วตรวจผลให้ด้วย"><b>▶️ Run / AUTO</b><small>คิด → ทำ → ตรวจ</small></button></div><div class="keybox"><b>🔐 AI Key Vault</b><div class="keyrow"><input id="key" type="password" placeholder="OpenRouter API key"><button id="save">บันทึก</button></div><div class="keyhint">คีย์เก็บเฉพาะในอุปกรณ์นี้และส่งผ่าน HTTPS ตอนเรียก API เท่านั้น ไม่ฝังลง source</div></div><button class="close" id="close">ปิด</button></div></div>
<script>
const $=id=>document.getElementById(id),input=$('input'),send=$('send'),stream=$('stream'),chat=$('chat'),status=$('status'),files=$('files'),filelist=$('filelist');let history=[],busy=false,attachments=[];const KEY='cf_openrouter_key';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function digital(){const n=['🧠 วิเคราะห์','🗺️ วางแผน','⚡ โมเดล','🧰 เครื่องมือ','🔧 ลงมือ','🧪 ตรวจ','✅ เสร็จ'];return `<div class="digital"><div class="digital-head"><span>👑 BOSS DIGITAL WORKSTATION</span><span id="dstate">ทำงาน</span></div><div class="digits" id="digits">00.000 s</div><div class="stage">${n.map((x,i)=>`<span data-stage="${i}">${x}</span>`).join('')}</div></div>`}
function welcome(){stream.innerHTML=`<div class="welcome"><div class="hero">💜</div><h1>Boss พร้อมครับ</h1><p>คุยหรือสั่งปกติได้เลย — ระบบคิดเอง เลือกโมเดล/เครื่องมือเอง และตรวจผลก่อนตอบ</p><div class="quick"><button data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่เหมาะที่สุด">🧠 ตรวจโมเดล</button><button data-q="ทดสอบ Sandbox ให้หน่อย">🧪 Sandbox</button><button data-q="ตรวจระบบ CodingFleet ให้หน่อย">⚙️ CodingFleet</button></div></div>`;bindQuick()}
function render(){if(!history.length)return welcome();stream.innerHTML='';history.forEach((m,i)=>{const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="body"><div class="bubble">${esc(m.content)}</div>${m.files?.length?`<div class="attach">📎 ${m.files.map(esc).join(' · ')}</div>`:''}<div class="meta">${m.role==='user'?'พี่นุ':'💜 Boss · '+esc(m.provider||'Auto')}</div>${m.role==='assistant'?'<button class="copy">📋 คัดลอก</button>':''}</div>`;stream.appendChild(e)});document.querySelectorAll('.copy').forEach((b,i)=>b.onclick=async()=>{const a=[...document.querySelectorAll('.msg.bot .bubble')][i];try{await navigator.clipboard.writeText(a.innerText);b.textContent='✓ คัดลอกแล้ว'}catch{}});chat.scrollTop=chat.scrollHeight}
function bindQuick(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q))}
function showFiles(){filelist.innerHTML=attachments.map(f=>`<span class="filepill">📎 ${esc(f.name)}</span>`).join('');if(attachments.length)status.textContent=`แนบ ${attachments.length} ไฟล์ · Auto`}
files.onchange=()=>{attachments=[...files.files];showFiles()};
function stage(n,label){document.querySelectorAll('.stage span').forEach((x,i)=>x.className=i<n?'on':'');const d=$('dstate');if(d)d.textContent=label}
async function ask(text){if(busy)return;const q=(text||input.value).trim();if(!q&&!attachments.length)return;busy=true;const names=attachments.map(f=>f.name);history.push({role:'user',content:q||'ส่งไฟล์ให้ตรวจ',files:names});render();input.value='';send.disabled=true;const box=document.createElement('div');box.innerHTML=digital();stream.appendChild(box.firstElementChild);const started=performance.now(),timer=setInterval(()=>{const d=$('digits');if(d)d.textContent=((performance.now()-started)/1000).toFixed(3)+' s'},40);try{stage(1,'กำลังวางแผน');status.textContent='🧠 วิเคราะห์…';stage(2,'กำลังเลือกโมเดล');const key=localStorage.getItem(KEY)||'';stage(3,'กำลังเลือกเครื่องมือ');const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q||'วิเคราะห์ไฟล์ที่แนบมา',history:history.filter(x=>x.role==='user'||x.role==='assistant').slice(-14),room:'living',who:'silelo',provider:'auto',model:'',clientKeys:{openrouter:key},attachments:names,opt:{lang:'th',len:'normal',mode:'agent'}})});stage(5,'กำลังตรวจสอบ');const d=await r.json();if(!r.ok)throw new Error(d.error||'Boss API ตอบไม่ได้');history.push({role:'assistant',content:d.reply||d.message||'ไม่มีคำตอบ',provider:d.providerLabel||'Auto'});localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)));stage(6,'เสร็จแล้ว');status.textContent='✅ เสร็จแล้ว · '+(d.providerLabel||'Auto');render()}catch(e){stage(5,'พบปัญหา');history.push({role:'assistant',content:'⚠️ '+e.message,provider:'System'});status.textContent='❌ '+e.message;render()}finally{clearInterval(timer);busy=false;send.disabled=false;attachments=[];files.value='';showFiles()}}
send.onclick=()=>ask();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});$('tools').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');$('save').onclick=()=>{const v=$('key').value.trim();if(v)localStorage.setItem(KEY,v);$('sheet').classList.remove('open');status.textContent='🔐 Key พร้อม · Auto'};$('sandbox').onclick=()=>{input.value='ใช้ Sandbox ทำงานนี้ให้';input.focus()};$('fleet').onclick=()=>{input.value='ใช้ CodingFleet ทำงานนี้ให้';input.focus()};$('run').onclick=()=>{input.value='รันงานนี้แบบ AUTO แล้วตรวจผลให้ด้วย';ask()};
$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='🎙️ เบราว์เซอร์นี้ไม่รองรับเสียง';return}const r=new SR();r.lang='th-TH';r.interimResults=false;r.onstart=()=>status.textContent='🎙️ กำลังฟัง…';r.onresult=e=>{input.value=(input.value+' '+e.results[0][0].transcript).trim();status.textContent='พร้อม · Auto';input.focus()};r.onerror=e=>status.textContent='🎙️ '+e.error;r.onend=()=>{if(!busy)status.textContent='พร้อม · Auto'};r.start()};
try{history=JSON.parse(localStorage.getItem('cf_living_chat')||'[]').slice(-120)}catch{history=[]}render();
</script></body></html>
