<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c"><meta http-equiv="Cache-Control" content="no-store">
<title>CF Boss · Living Chat</title>
<style>
:root{--bg:#08080b;--panel:#121217;--line:#292933;--text:#f7f7fb;--muted:#92929f;--a:#a855f7;--ok:#34d399}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(800px 420px at 50% -15%,#7c3aed22,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #ffffff10;background:#09090de8;backdrop-filter:blur(20px);z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899)}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:2px}.grow{flex:1}.auto{display:flex;align-items:center;gap:6px;border:1px solid #3b2b50;background:#15111c;border-radius:999px;padding:7px 10px;font-size:10px}.auto i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}.icon,.crown{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);cursor:pointer}.icon{font-size:20px}.chat{flex:1;overflow:auto;padding:14px 10px 145px}.stream{max-width:850px;margin:auto}.welcome{text-align:center;margin:10vh auto 0;max-width:650px}.hero{width:70px;height:70px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ec4899);font-size:31px;box-shadow:0 18px 55px #a855f733}.welcome h1{font-size:clamp(29px,7vw,46px);letter-spacing:-.05em;margin:16px 0 7px}.welcome p{color:var(--muted);line-height:1.65;margin:0}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:20px auto}.quick button{border:1px solid var(--line);background:#111117;color:#ddd;border-radius:999px;padding:8px 11px;cursor:pointer}.msg{display:flex;gap:8px;margin:9px 0}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:#22222a}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:90%}.bubble{padding:10px 13px;border-radius:15px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere;background:linear-gradient(145deg,#15151c,#111117);border:1px solid #25252f}.user .bubble{background:linear-gradient(145deg,#3b2266,#2b174b);border-color:#55328a}.meta{font-size:9px;color:var(--muted);margin:3px 6px}.copy{margin:2px 6px 0;border:1px solid #292933;background:#101015;color:#aaaab5;border-radius:8px;padding:4px 7px;font-size:10px;cursor:pointer}.trace{margin:8px 0 11px;border:1px solid var(--line);background:#0e0e13;border-radius:14px;padding:9px}.traceHead{font-size:10px;color:#d8d8e1;display:flex;justify-content:space-between}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}.step{border:1px solid #25252e;border-radius:9px;padding:6px;color:#6f6f7a;font-size:9px}.step.active{border-color:#6841a0;color:#eadcff;background:#181321}.step.done{border-color:#24563f;color:#a5f3d0}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 9px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08080c 24%);z-index:10}.box{max-width:850px;margin:auto;border:1px solid #34343e;border-radius:22px;background:#141419eF;backdrop-filter:blur(22px);padding:7px}.row{display:flex;gap:6px;align-items:flex-end}.input{flex:1;min-height:48px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 11px;line-height:1.5;font-size:16px}.crown{font-size:20px;border-color:#5b3b82;background:linear-gradient(145deg,#241533,#17111e)}.send{width:46px;height:46px;border:0;border-radius:14px;background:#fff;color:#111;font-size:20px;cursor:pointer}.send:disabled{opacity:.45}.under{display:flex;gap:5px;align-items:center;overflow:auto;padding:3px 3px 0}.chip{border:1px solid #25252d;background:#101015;color:#aaaab5;border-radius:8px;padding:5px 8px;font-size:9px;white-space:nowrap}.status{margin-left:auto;color:#858591;font-size:9px;white-space:nowrap}.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:30}.sheet.open{display:flex}.panel{width:100%;max-width:560px;margin:auto auto 0;background:#111117;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:15px}.panel h3{margin:0 0 4px}.panel p{color:var(--muted);font-size:11px;margin:0 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action,.close{border:1px solid var(--line);border-radius:13px;background:#17171f;color:var(--text);padding:12px;text-align:left;cursor:pointer}.action b{display:block;margin-bottom:3px}.action small{color:var(--muted)}.close{width:100%;margin-top:8px;text-align:center}@media(max-width:520px){.brand small{display:none}.auto{padding:7px 8px}.steps{grid-template-columns:repeat(2,1fr)}.under .chip:nth-child(3){display:none}.status{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">💜</div><div>CF Boss<small>Living · Auto Agent</small></div></div><div class="grow"></div><div class="auto"><i></i> Auto · Boss เลือกให้</div><button class="icon" id="tools" aria-label="เครื่องมือ">＋</button></header>
<main class="chat" id="chat"><div class="stream" id="stream"></div></main>
<div class="composer"><div class="box"><div class="row"><button class="crown" id="crown" title="เรียก Boss" aria-label="เรียก Boss">👑</button><textarea id="input" class="input" placeholder="บอก Boss ว่าอยากทำอะไร…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><button class="chip">📎 แนบ</button><button class="chip">🌐 Web</button><button class="chip">🧠 Memory</button><span class="status" id="status">พร้อม · Auto</span></div></div></div>
</div>
<div class="sheet" id="sheet"><div class="panel"><h3>🔧 ความสามารถของ Boss</h3><p>ไม่ต้องออกจากห้อง — Boss เป็นคนเลือกใช้เครื่องมือให้เอง</p><div class="actions"><button class="action" data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้"><b>👀 ตรวจบ้าน</b><small>ดู UI/UX และหาจุดที่ควรปรับ</small></button><button class="action" data-q="ใช้ CodingFleet ทำงานนี้ให้"><b>🚗 CodingFleet</b><small>วางแผน → ทำ → ตรวจสอบ</small></button><button class="action" data-q="คำนวณให้หน่อย"><b>🧮 Calculator</b><small>คำนวณผ่านแชทโดยไม่เปิดห้องใหม่</small></button><button class="action" data-q="ตรวจระบบและเครื่องมือของบ้านให้หน่อย"><b>🧪 Verify</b><small>ตรวจผลก่อนรายงานว่าสำเร็จ</small></button></div><button class="close" id="close">ปิด</button></div></div>
<script>
const $=id=>document.getElementById(id),input=$('input'),send=$('send'),stream=$('stream'),chat=$('chat'),status=$('status');let history=[],busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function trace(done=true){return `<div class="trace"><div class="traceHead"><span>⚙️ Boss Activity</span><span>${done?'ตรวจสอบแล้ว':'กำลังทำงาน'}</span></div><div class="steps"><div class="step done">🧠 <b>วิเคราะห์</b></div><div class="step done">🔧 <b>ทำงาน</b></div><div class="step done">🧪 <b>ตรวจสอบ</b></div><div class="step done">✅ <b>เสร็จ</b></div></div></div>`}
function welcome(){return `<div class="welcome"><div class="hero">💜</div><h1>Boss มาแล้วครับ</h1><p>คุยช่องเดียวพอ บอสจะเข้าใจ → วางแผน → เลือกโมเดล/เครื่องมือ → ลงมือ → ตรวจสอบ</p><div class="quick"><button data-q="ตรวจบ้าน CF Boss ให้ครบ แล้วบอกสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button data-q="ช่วยปรับบ้านให้ใช้งานง่ายขึ้น">✨ ปรับให้สวย</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่เหมาะที่สุด">🧠 ตรวจโมเดล</button><button data-q="ทดสอบระบบ Sandbox ให้หน่อย">🧪 ทดสอบ</button></div></div>`}
function render(){stream.innerHTML='';if(!history.length){stream.innerHTML=welcome();bindQuick();return}history.forEach(m=>{const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'พี่นุ':'💜 Boss · '+(m.provider||'Auto')}</div>${m.role==='assistant'?'<button class="copy">📋 คัดลอก</button>':''}</div>`;stream.appendChild(e)});document.querySelectorAll('.copy').forEach((b,i)=>b.onclick=async()=>{const msg=[...document.querySelectorAll('.msg.bot .bubble')][i];try{await navigator.clipboard.writeText(msg.innerText);b.textContent='✓ คัดลอกแล้ว';setTimeout(()=>b.textContent='📋 คัดลอก',1400)}catch{b.textContent='คัดลอกไม่ได้'}});chat.scrollTop=chat.scrollHeight}
function bindQuick(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;ask()})}
async function ask(text){if(busy)return;const q=(text||input.value).trim();if(!q)return;busy=true;history.push({role:'user',content:q});render();input.value='';send.disabled=true;status.textContent='🧠 กำลังวิเคราะห์…';const t=document.createElement('div');t.className='stream';t.innerHTML=trace(false);chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{status.textContent='🔧 กำลังทำงาน…';const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(-14),room:'living',who:'silelo',provider:'auto',model:'',opt:{lang:'th',len:'normal',mode:'agent'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Boss API ตอบไม่ได้');status.textContent='🧪 กำลังตรวจสอบ…';history.push({role:'assistant',content:d.reply||d.message||'บอสยังตอบไม่ได้',provider:d.providerLabel||'Auto'});localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)));status.textContent='✅ เสร็จแล้ว · '+(d.providerLabel||'Auto');render()}catch(e){history.push({role:'assistant',content:'⚠️ '+e.message,provider:'System'});status.textContent='❌ ตรวจพบปัญหา';render()}finally{busy=false;send.disabled=false;input.focus()}}
function load(){try{history=JSON.parse(localStorage.getItem('cf_living_chat')||'[]')}catch{history=[]}render()}
$('crown').onclick=()=>{input.focus();status.textContent='👑 Boss มาแล้วครับ';input.placeholder='Boss พร้อมครับ… บอกเป้าหมายได้เลย';setTimeout(()=>status.textContent='พร้อม · Auto',1800)};$('send').onclick=()=>ask();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});$('tools').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{$('sheet').classList.remove('open');input.value=b.dataset.q;ask()});load();
</script>
</body></html>
