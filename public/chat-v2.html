<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><title>CF Bossnusilelo</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171c;--panel2:#202027;--line:#2b2b34;--text:#f5f5f5;--muted:#a3a3ad;--accent:#a78bfa;--user:#2a174f;--bot:#17171c}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(11,11,15,.94);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand{font-weight:700;font-size:15px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.top button,.select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;height:38px;padding:0 11px;font:inherit;cursor:pointer}.top .grow{flex:1}.select{max-width:150px;font-size:12px}.new{font-size:12px}.chat{width:min(820px,100%);margin:0 auto;flex:1;overflow:auto;padding:24px 18px 150px}.empty{text-align:center;margin-top:20vh;color:var(--muted)}.empty h1{color:var(--text);font-size:28px;margin:0 0 8px}.empty p{margin:0}.msg{display:flex;margin:18px 0;gap:12px}.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#282832;flex:none;font-size:16px}.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.bubble{max-width:min(720px,88%);padding:11px 14px;border-radius:18px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.bot .bubble{background:var(--bot)}.msg.user .bubble{background:var(--user);border:1px solid #4c2777}.meta{font-size:10px;color:var(--muted);margin:5px 4px}.composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);z-index:4}.composer{width:min(820px,100%);margin:auto;border:1px solid #3a3a44;background:#17171c;border-radius:24px;padding:8px;box-shadow:0 10px 40px #0008}.row{display:flex;align-items:flex-end;gap:8px}.textarea{flex:1;background:transparent;color:var(--text);border:0;outline:0;resize:none;max-height:180px;min-height:42px;padding:10px 8px;font:inherit;line-height:1.45}.send{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:18px;cursor:pointer}.send:disabled{opacity:.35;cursor:default}.under{display:flex;align-items:center;gap:6px;padding:3px 5px 0}.under button,.under select{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px;cursor:pointer}.status{margin-left:auto;font-size:10px;color:var(--muted)}.typing{display:inline-flex;gap:4px;padding:8px 12px;background:var(--panel);border-radius:16px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25}}.error{color:#fca5a5}.copy{float:right;margin-left:10px;border:0;background:transparent;color:#777;cursor:pointer}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:20}.drawer.show{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;background:#17171c;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px;max-height:70vh;overflow:auto}.sheet h3{margin:0 0 12px}.option{display:block;width:100%;text-align:left;padding:13px;border:1px solid var(--line);background:#202027;color:var(--text);border-radius:12px;margin:7px 0;cursor:pointer}.option.on{border-color:var(--accent)}@media(max-width:600px){.top{padding:8px}.brand small{display:none}.select{max-width:105px}.chat{padding-left:10px;padding-right:10px}.bubble{max-width:92%;font-size:15px}.empty h1{font-size:24px}}
</style></head>
<body><div class="app">
<header class="top"><button id="menu" aria-label="เมนู">☰</button><div class="brand">CF Bossnusilelo<small>ห้องแชทส่วนตัว</small></div><div class="grow"></div><select id="room" class="select" aria-label="ห้อง"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="sleep">🌙 ห้องพักผ่อน</option></select><button id="new" class="new">＋ แชทใหม่</button></header>
<main id="chat" class="chat"><div id="empty" class="empty"><h1>สวัสดีครับ 👋</h1><p>พิมพ์ข้อความได้เลย บอสจะจัดการต่อให้</p></div></main>
<div class="composer-wrap"><div class="composer"><div class="row"><textarea id="input" class="textarea" rows="1" placeholder="ส่งข้อความถึงสลี่..."></textarea><button id="send" class="send" aria-label="ส่ง">↑</button></div><div class="under"><button id="modelBtn">🤖 Auto</button><button id="clear">ล้างแชท</button><span id="status" class="status">พร้อม</span></div></div></div>
</div>
<div id="drawer" class="drawer"><div class="sheet"><h3>เลือกโมเดล</h3><button class="option on" data-provider="auto">🤖 Auto — เลือกตัวที่พร้อมให้อัตโนมัติ</button><button class="option" data-provider="siliconflow">⚡ SiliconFlow</button><button class="option" data-provider="openrouter">🌐 OpenRouter</button><button class="option" data-provider="groq">🚀 Groq</button><button id="closeDrawer" class="option">ปิด</button></div></div>
<script>
const $=id=>document.getElementById(id), input=$('input'), send=$('send'), chat=$('chat'), empty=$('empty'), roomSel=$('room'), statusEl=$('status');
let provider=localStorage.getItem('cf_provider')||'auto', busy=false;
const key=()=>`cf_chat_v2_${roomSel.value}`;
let history=JSON.parse(localStorage.getItem(key())||'[]');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderText(s){let x=esc(s);x=x.replace(/```([\s\S]*?)```/g,'<pre style="white-space:pre-wrap;background:#0d0d12;border:1px solid #2b2b34;border-radius:10px;padding:12px;overflow:auto">$1</pre>');return x.replace(/\n/g,'<br>')}
function render(){chat.innerHTML='';if(!history.length){chat.appendChild(empty);return}history.forEach((m,i)=>{const row=document.createElement('div');row.className='msg '+(m.role==='user'?'user':'bot');row.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div><div class="bubble">${renderText(m.content)}${m.role==='assistant'?`<button class="copy" data-i="${i}" title="คัดลอก">⧉</button>`:''}</div><div class="meta">${m.role==='user'?'คุณ':'สลี่'} · ${new Date(m.t||Date.now()).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</div></div>`;chat.appendChild(row)});chat.scrollTop=chat.scrollHeight;document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(history[+b.dataset.i].content));}
function save(){localStorage.setItem(key(),JSON.stringify(history.slice(-40)))}
function setStatus(t,err=false){statusEl.textContent=t;statusEl.className='status'+(err?' error':'')}
async function ask(){if(busy)return;const q=input.value.trim();if(!q)return;busy=true;send.disabled=true;history.push({role:'user',content:q,t:Date.now()});save();input.value='';input.style.height='42px';render();setStatus('กำลังคิด…');const typing=document.createElement('div');typing.className='msg bot';typing.innerHTML='<div class="avatar">💜</div><div class="typing"><i></i><i></i><i></i></div>';chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(0,-1),room:roomSel.value,who:roomSel.value==='study'?'teacher':'silelo',provider,model:'',opt:{lang:'th',len:'normal'}})});const d=await r.json().catch(()=>({}));typing.remove();if(!r.ok){throw new Error([d.error,...(d.details||[])].filter(Boolean).join('\n'))}history.push({role:'assistant',content:d.reply||d.replies?.[0]?.reply||'ไม่มีข้อความตอบกลับ',t:Date.now(),provider:d.provider,model:d.model});save();render();setStatus(`${d.provider||'AI'} · ${d.model||''}`)}catch(e){typing.remove();history.push({role:'assistant',content:'⚠️ '+e.message,t:Date.now()});save();render();setStatus('เชื่อมต่อไม่สำเร็จ',true)}finally{busy=false;send.disabled=false;input.focus()}}
input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});send.onclick=ask;
$('new').onclick=()=>{history=[];save();render();input.focus()};$('clear').onclick=()=>{if(confirm('ล้างบทสนทนาห้องนี้?')){$('new').click()}};
roomSel.onchange=()=>{history=JSON.parse(localStorage.getItem(key())||'[]');render();};$('modelBtn').onclick=()=>{$('drawer').classList.add('show')};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('show')};$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{provider=b.dataset.provider;localStorage.setItem('cf_provider',provider);document.querySelectorAll('[data-provider]').forEach(x=>x.classList.toggle('on',x.dataset.provider===provider));$('modelBtn').textContent='🤖 '+(provider==='auto'?'Auto':provider);$('drawer').classList.remove('show')});
render();input.focus();
</script></body></html>
