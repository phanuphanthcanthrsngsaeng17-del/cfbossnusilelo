<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><title>CF Bossnusilelo</title><style>:root{--bg:#0b0b0f;--panel:#17171c;--line:#2b2b34;--text:#f5f5f5;--muted:#a3a3ad;--accent:#a78bfa;--user:#2a174f}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.app{height:100%;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0b0b0fee;backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.brand{font-weight:700;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.top button,.select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;height:38px;padding:0 11px;font:inherit;cursor:pointer}.grow{flex:1}.select{max-width:150px;font-size:12px}.chat{width:min(820px,100%);margin:0 auto;flex:1;overflow:auto;padding:24px 18px 150px}.empty{text-align:center;margin-top:20vh;color:var(--muted)}.empty h1{color:var(--text);font-size:28px;margin:0 0 8px}.msg{display:flex;margin:18px 0;gap:12px}.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#282832;flex:none}.msg.user{justify-content:flex-end}.msg.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.bubble{max-width:min(720px,88%);padding:11px 14px;border-radius:18px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.bot .bubble{background:var(--panel)}.msg.user .bubble{background:var(--user);border:1px solid #4c2777}.meta{font-size:10px;color:var(--muted);margin:5px 4px}.copy{float:right;margin-left:10px;border:0;background:transparent;color:#777;cursor:pointer}.composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);z-index:4}.composer{width:min(820px,100%);margin:auto;border:1px solid #3a3a44;background:var(--panel);border-radius:24px;padding:8px;box-shadow:0 10px 40px #0008}.row{display:flex;align-items:flex-end;gap:8px}.textarea{flex:1;background:transparent;color:var(--text);border:0;outline:0;resize:none;max-height:180px;min-height:42px;padding:10px 8px;font:inherit;line-height:1.45}.send{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:18px;cursor:pointer}.send:disabled{opacity:.35}.under{display:flex;align-items:center;gap:6px;padding:3px 5px 0}.under button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px;cursor:pointer}.status{margin-left:auto;font-size:10px;color:var(--muted)}.error{color:#fca5a5}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:20}.drawer.show{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px;max-height:78vh;overflow:auto}.sheet h3{margin:0 0 5px}.sheet p{color:var(--muted);font-size:12px;margin:0 0 12px}.option{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px;border:1px solid var(--line);background:#202027;color:var(--text);border-radius:12px;margin:7px 0;cursor:pointer}.option.on{border-color:var(--accent)}.badge{font-size:10px;color:#9ca3af}.free{color:#86efac}@media(max-width:600px){.top{padding:8px}.select{max-width:120px}.chat{padding-left:10px;padding-right:10px}.bubble{max-width:92%}.empty h1{font-size:24px}}</style></head><body><div class="app"><header class="top"><button id="menu">☰</button><div class="brand">CF Bossnusilelo<small>AI multi-provider</small></div><div class="grow"></div><select id="room" class="select"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="sleep">🌙 ห้องพักผ่อน</option></select><button id="new">＋ ใหม่</button></header><main id="chat" class="chat"><div id="empty" class="empty"><h1>สวัสดีครับ 👋</h1><p>พิมพ์ข้อความได้เลย บอสจะเลือก AI ที่พร้อมให้เอง</p></div></main><div class="composer-wrap"><div class="composer"><div class="row"><textarea id="input" class="textarea" rows="1" placeholder="ส่งข้อความ..."></textarea><button id="send" class="send">↑</button></div><div class="under"><button id="modelBtn">🤖 Auto</button><button id="clear">ล้างแชท</button><span id="status" class="status">พร้อม</span></div></div></div></div><div id="drawer" class="drawer"><div class="sheet"><h3>เลือกผู้ให้บริการ AI</h3><p>Auto จะลองเฉพาะตัวที่มี API Key ใน Vercel และข้ามตัวที่ใช้ไม่ได้ให้อัตโนมัติ</p><div id="providers"></div><button id="closeDrawer" class="option">ปิด</button></div></div><script>
const $=id=>document.getElementById(id),input=$('input'),send=$('send'),chat=$('chat'),empty=$('empty'),roomSel=$('room'),statusEl=$('status');let provider=localStorage.getItem('cf_provider')||'auto',busy=false;const key=()=>`cf_chat_v2_${roomSel.value}`;let history=JSON.parse(localStorage.getItem(key())||'[]');const labels={auto:'🤖 Auto'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderText(s){return esc(s).replace(/```([\s\S]*?)```/g,'<pre style="white-space:pre-wrap;background:#0d0d12;border:1px solid #2b2b34;border-radius:10px;padding:12px;overflow:auto">$1</pre>').replace(/\n/g,'<br>')}
function render(){chat.innerHTML='';if(!history.length){chat.appendChild(empty);return}history.forEach((m,i)=>{const row=document.createElement('div');row.className='msg '+(m.role==='user'?'user':'bot');row.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div><div class="bubble">${renderText(m.content)}${m.role==='assistant'?`<button class="copy" data-i="${i}">⧉</button>`:''}</div><div class="meta">${m.role==='user'?'คุณ':'สลี่'} · ${new Date(m.t||Date.now()).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}${m.provider?` · ${m.provider}`:''}</div></div>`;chat.appendChild(row)});chat.scrollTop=chat.scrollHeight;document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(history[+b.dataset.i].content))}
function save(){localStorage.setItem(key(),JSON.stringify(history.slice(-40)))}function setStatus(t,err=false){statusEl.textContent=t;statusEl.className='status'+(err?' error':'')}
async function loadProviders(){try{const r=await fetch('/api/chat');const d=await r.json();if(!d.providers)return;const wrap=$('providers');wrap.innerHTML='';const auto=document.createElement('button');auto.className='option '+(provider==='auto'?'on':'');auto.innerHTML='<span>🤖 Auto<br><span class="badge">ลองตัวที่พร้อมตามลำดับ</span></span><span class="free">AUTO</span>';auto.onclick=()=>choose('auto');wrap.appendChild(auto);for(const [id,p] of Object.entries(d.providers)){labels[id]=p.label;const b=document.createElement('button');b.className='option '+(provider===id?'on':'');b.innerHTML=`<span>${p.label}<br><span class="badge">${p.model||'ตั้ง Model ใน Vercel'}</span></span><span class="${p.configured?'free':''}">${p.configured?'พร้อม':'ยังไม่ตั้ง Key'}</span>`;b.onclick=()=>choose(id);wrap.appendChild(b)}}catch{}}
function choose(p){provider=p;localStorage.setItem('cf_provider',p);$('modelBtn').textContent='🤖 '+(labels[p]||p);$('drawer').classList.remove('show');loadProviders()}
async function ask(){if(busy)return;const q=input.value.trim();if(!q)return;busy=true;send.disabled=true;history.push({role:'user',content:q,t:Date.now()});save();input.value='';input.style.height='42px';render();setStatus('กำลังคิด…');const typing=document.createElement('div');typing.className='msg bot';typing.innerHTML='<div class="avatar">💜</div><div class="bubble">กำลังเลือก AI ที่พร้อม…</div>';chat.appendChild(typing);chat.scrollTop=chat.scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(0,-1),room:roomSel.value,who:roomSel.value==='study'?'teacher':'silelo',provider,model:'',opt:{lang:'th',len:'normal'}})});const d=await r.json().catch(()=>({}));typing.remove();if(!r.ok)throw new Error([d.error,...(d.details||[])].filter(Boolean).join('\n'));history.push({role:'assistant',content:d.reply||'ไม่มีข้อความตอบกลับ',t:Date.now(),provider:d.providerLabel||d.provider,model:d.model});save();render();setStatus(`${d.providerLabel||d.provider} · ${d.model||''}`)}catch(e){typing.remove();history.push({role:'assistant',content:'⚠️ '+e.message,t:Date.now()});save();render();setStatus('เชื่อมต่อไม่สำเร็จ',true)}finally{busy=false;send.disabled=false;input.focus()}}
input.oninput=()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,180)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};send.onclick=ask;$('new').onclick=()=>{history=[];save();render();input.focus()};$('clear').onclick=()=>{if(confirm('ล้างบทสนทนาห้องนี้?'))$('new').click()};roomSel.onchange=()=>{history=JSON.parse(localStorage.getItem(key())||'[]');render()};$('modelBtn').onclick=()=>{$('drawer').classList.add('show');loadProviders()};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('show')};$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};render();input.focus();loadProviders();
</script></body></html>
