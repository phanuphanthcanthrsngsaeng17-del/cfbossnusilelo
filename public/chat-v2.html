<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><title>CF Bossnusilelo</title><style>:root{--bg:#0b0b0f;--panel:#17171c;--panel2:#202027;--line:#30303a;--text:#f5f5f7;--muted:#9b9ba7;--accent:#a78bfa;--user:#3a2163;--good:#22c55e}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select,textarea{font:inherit}.app{height:100dvh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0b0b0ff2;backdrop-filter:blur(18px);position:sticky;top:0;z-index:8}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#17171c;color:var(--text);font-size:23px;display:grid;place-items:center;cursor:pointer}.brand{font-weight:800;font-size:16px;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px}.grow{flex:1}.room{max-width:190px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;height:42px;padding:0 12px}.chat{width:min(860px,100%);margin:0 auto;flex:1;overflow:auto;padding:22px 14px 190px;scroll-behavior:smooth}.empty{text-align:center;margin-top:20vh;color:var(--muted)}.empty .logo{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#24242d;font-size:30px}.empty h1{color:var(--text);font-size:28px;margin:12px 0 6px}.empty p{margin:0}.msg{display:flex;gap:11px;margin:20px 0;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:34px;height:34px;border-radius:50%;background:#282832;display:grid;place-items:center;flex:none}.msg.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.msgbody{max-width:min(760px,88%)}.bubble{padding:13px 15px;border-radius:18px;line-height:1.7;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.bot .bubble{background:#18181d}.msg.user .bubble{background:var(--user);border:1px solid #55328a}.meta{font-size:10px;color:var(--muted);margin:5px 5px}.copy{float:right;border:0;background:transparent;color:#777;cursor:pointer}.processing{display:flex;gap:10px;align-items:center;color:#c4c4ce;font-size:14px}.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:b 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}.progress{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#121217;color:var(--muted);font-size:12px}.progress span{color:#ddd}.composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%);z-index:7}.composer{width:min(860px,100%);margin:auto;border:1px solid #3a3a44;background:#18181d;border-radius:24px;padding:8px;box-shadow:0 12px 45px #0009}.inputrow{display:flex;gap:8px;align-items:flex-end}.textarea{flex:1;min-height:46px;max-height:170px;background:transparent;color:var(--text);border:0;outline:0;resize:none;padding:10px 8px;line-height:1.5}.send{width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#111;font-size:21px;cursor:pointer}.send:disabled{opacity:.35}.tools{display:flex;align-items:center;gap:5px;padding:4px 2px 0;overflow-x:auto}.tool{height:34px;min-width:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);padding:0 9px;cursor:pointer;white-space:nowrap}.tool:hover,.tool.active{background:#28282f;color:#fff}.model{margin-left:auto;max-width:230px;overflow:hidden;text-overflow:ellipsis}.model .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}.status{font-size:10px;color:var(--muted);padding:3px 8px 0}.status.error{color:#fca5a5}.sheetback{position:fixed;inset:0;background:#0009;display:none;z-index:30}.sheetback.show{display:block}.sheet{position:absolute;left:12px;right:12px;bottom:88px;background:#1c1c21;border:1px solid #363640;border-radius:22px;padding:12px;box-shadow:0 20px 60px #000b}.sheet h3{margin:4px 8px 12px;font-size:16px}.sheet p{margin:0 8px 10px;color:var(--muted);font-size:12px}.option{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);padding:12px 10px;border-radius:14px;text-align:left;cursor:pointer}.option:hover,.option.on{background:#29292f}.option .ico{width:34px;height:34px;border-radius:50%;background:#34343b;display:grid;place-items:center}.option small{display:block;color:var(--muted);margin-top:2px}.drawer{position:fixed;inset:0;background:#0009;display:none;z-index:40}.drawer.show{display:block}.providerSheet{position:absolute;left:12px;right:12px;bottom:88px;max-height:70vh;overflow:auto;background:#1c1c21;border:1px solid #363640;border-radius:22px;padding:12px}.providerSheet h3{margin:5px 8px}.providerSheet p{margin:0 8px 12px;color:var(--muted);font-size:12px}.provider{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border:1px solid var(--line);background:#232329;color:var(--text);border-radius:13px;margin:7px 0;text-align:left;cursor:pointer}.provider.on{border-color:var(--accent)}.ready{color:#86efac;font-size:11px}.notready{color:#888;font-size:11px}@media(max-width:600px){.top{padding:8px}.brand{font-size:14px}.room{max-width:145px}.chat{padding-left:9px;padding-right:9px}.bubble{font-size:15px}.msgbody{max-width:92%}.model{max-width:180px}}</style></head><body><div class="app"><header class="top"><button class="icon" id="menu" aria-label="เมนู">☰</button><div class="brand">CF Bossnusilelo<small>AI multi-provider</small></div><div class="grow"></div><select id="room" class="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="sleep">🌙 ห้องพักผ่อน</option></select><button class="icon" id="new" aria-label="แชทใหม่">＋</button></header><main id="chat" class="chat"><div id="empty" class="empty"><div class="logo">💜</div><h1>สวัสดีครับ 👋</h1><p>พิมพ์ข้อความได้เลย บอสจะเลือก AI ที่พร้อมให้เอง</p></div></main><div class="composer-wrap"><div class="composer"><div class="inputrow"><textarea id="input" class="textarea" rows="1" placeholder="ส่งข้อความ..."></textarea><button id="send" class="send" aria-label="ส่ง">↑</button></div><div class="tools"><button class="tool" id="attach">📎</button><button class="tool" id="tools">＋ เครื่องมือ</button><button class="tool" id="modelBtn"><span class="dot"></span><span id="modelLabel">Auto</span> ▾</button></div><div id="status" class="status">พร้อม</div></div></div></div><div id="toolSheet" class="sheetback"><div class="sheet"><h3>เครื่องมือ</h3><p>เปิดใช้ความสามารถเสริมได้จากตรงนี้</p><button class="option" data-tool="image"><span class="ico">🖼️</span><span>สร้างรูปภาพ<small>เตรียมคำสั่งสำหรับ image generation</small></span></button><button class="option" data-tool="think"><span class="ico">🧠</span><span>กำลังคิด<small>แสดงสถานะการประมวลผลแบบย่อ โดยไม่เปิดเผย chain-of-thought</small></span></button><button class="option" data-tool="web"><span class="ico">🌐</span><span>ค้นหาเว็บ<small>โหมดสำหรับคำถามที่ต้องใช้ข้อมูลล่าสุด</small></span></button><button class="option" data-tool="deep"><span class="ico">🔎</span><span>ข้อมูลเชิงลึก<small>วิเคราะห์และสรุปให้ละเอียดขึ้น</small></span></button><button class="option" data-tool="github"><span class="ico">◉</span><span>GitHub<small>โหมดสำหรับงานโค้ดและ repository</small></span></button><button class="option" data-tool="openai"><span class="ico">◎</span><span>OpenAI Platform<small>โหมดสำหรับงาน API และเอกสาร</small></span></button></div></div><div id="drawer" class="drawer"><div class="providerSheet"><h3>เลือก AI / โมเดล</h3><p>Auto จะข้ามผู้ให้บริการที่ไม่มี Key หรือเรียกไม่สำเร็จ แล้วลองตัวถัดไป</p><div id="providers"></div><button class="option" id="closeDrawer">ปิด</button></div></div><script>const $=id=>document.getElementById(id),input=$('input'),send=$('send'),chat=$('chat'),empty=$('empty'),roomSel=$('room'),statusEl=$('status');let provider=localStorage.getItem('cf_provider')||'auto',busy=false,toolMode='';const key=()=>`cf_chat_v3_${roomSel.value}`;let history=JSON.parse(localStorage.getItem(key())||'[]');const labels={auto:'Auto'};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderText(s){return esc(s).replace(/```([\s\S]*?)```/g,'<pre style="white-space:pre-wrap;background:#0d0d12;border:1px solid #2b2b34;border-radius:10px;padding:12px;overflow:auto">$1</pre>').replace(/\n/g,'<br>')}function render(){chat.innerHTML='';if(!history.length){chat.appendChild(empty);return}history.forEach((m,i)=>{const row=document.createElement('div');row.className='msg '+(m.role==='user'?'user':'bot');row.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="msgbody"><div class="bubble">${renderText(m.content)}${m.role==='assistant'?`<button class="copy" data-i="${i}">⧉</button>`:''}</div><div class="meta">${m.role==='user'?'คุณ':'สลี่'} · ${new Date(m.t||Date.now()).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}${m.provider?` · ${esc(m.provider)}`:''}</div></div>`;chat.appendChild(row)});chat.scrollTop=chat.scrollHeight;document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(history[+b.dataset.i].content))}function save(){localStorage.setItem(key(),JSON.stringify(history.slice(-50)))}function setStatus(t,err=false){statusEl.textContent=t;statusEl.className='status'+(err?' error':'')}async function loadProviders(){try{const r=await fetch('/api/chat');const d=await r.json();if(!d.providers)return;const wrap=$('providers');wrap.innerHTML='';const auto=document.createElement('button');auto.className='provider '+(provider==='auto'?'on':'');auto.innerHTML='<span>🤖 Auto<br><small>เลือกตัวที่พร้อมให้อัตโนมัติ</small></span><span class="ready">AUTO</span>';auto.onclick=()=>choose('auto');wrap.appendChild(auto);for(const [id,p] of Object.entries(d.providers)){labels[id]=p.label;const b=document.createElement('button');b.className='provider '+(provider===id?'on':'');b.innerHTML=`<span>${esc(p.label)}<br><small>${esc(p.model||'ตั้ง Model ใน Vercel')}</small></span><span class="${p.configured?'ready':'notready'}">${p.configured?'พร้อม':'ยังไม่ตั้ง Key'}</span>`;b.onclick=()=>choose(id);wrap.appendChild(b)}}catch{}}function choose(p){provider=p;localStorage.setItem('cf_provider',p);$('modelLabel').textContent=labels[p]||p;$('drawer').classList.remove('show');loadProviders()}function processing(){const el=document.createElement('div');el.className='msg bot';el.id='processing';el.innerHTML='<div class="avatar">💜</div><div class="msgbody"><div class="bubble"><div class="processing"><span>กำลังประมวลผล</span><span class="dots"><i></i><i></i><i></i></span></div><div class="progress"><span>กำลังเลือกโมเดลที่เหมาะสม…</span><br>ตรวจสอบ provider · ส่งคำขอ · รอคำตอบ</div></div></div>';chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}async function ask(){if(busy)return;const q=input.value.trim();if(!q)return;busy=true;send.disabled=true;history.push({role:'user',content:q,t:Date.now()});save();input.value='';input.style.height='46px';render();setStatus(toolMode==='think'?'กำลังคิด…':'กำลังประมวลผล…');const typing=processing();try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(0,-1),room:roomSel.value,who:roomSel.value==='study'?'teacher':'silelo',provider,model:'',tool:toolMode,opt:{lang:'th',len:'normal'}})});const d=await r.json().catch(()=>({}));typing.remove();if(!r.ok)throw new Error([d.error,...(d.details||[])].filter(Boolean).join('\n'));history.push({role:'assistant',content:d.reply||'ไม่มีข้อความตอบกลับ',t:Date.now(),provider:d.providerLabel||d.provider,model:d.model});save();render();setStatus(`${d.providerLabel||d.provider} · ${d.model||'Auto'}`)}catch(e){typing.remove();history.push({role:'assistant',content:'⚠️ '+e.message,t:Date.now()});save();render();setStatus('เชื่อมต่อไม่สำเร็จ',true)}finally{busy=false;send.disabled=false;input.focus()}}input.oninput=()=>{input.style.height='46px';input.style.height=Math.min(input.scrollHeight,170)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};send.onclick=ask;$('new').onclick=()=>{history=[];save();render();input.focus()};roomSel.onchange=()=>{history=JSON.parse(localStorage.getItem(key())||'[]');render()};$('modelBtn').onclick=()=>{$('drawer').classList.add('show');loadProviders()};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('show')};$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('show')};$('tools').onclick=()=>{$('toolSheet').classList.add('show')};$('toolSheet').onclick=e=>{if(e.target===$('toolSheet'))$('toolSheet').classList.remove('show')};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{toolMode=b.dataset.tool;$('tools').textContent='🛠️ '+b.textContent.trim().split(' ')[0]+' '+b.textContent.trim().split(' ').slice(1).join(' ');$('toolSheet').classList.remove('show');setStatus('เปิดโหมด: '+b.textContent.trim())});$('menu').onclick=()=>$('toolSheet').classList.add('show');$('attach').onclick=()=>setStatus('แนบไฟล์: เตรียมไว้สำหรับรอบถัดไป');$('modelLabel').textContent=labels[provider]||provider;render();loadProviders();</script></body></html>
