<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>CF Boss · Living Chat</title><style>:root{--bg:#07070a;--panel:#111117;--line:#292933;--text:#f7f7fb;--muted:#92929f;--accent:#a855f7;--ok:#34d399}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(800px 420px at 70% -10%,#7c3aed22,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);background:#09090de8}.room{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0 10px}.grow{flex:1}.auto{display:flex;align-items:center;gap:7px;border:1px solid #3a2d52;background:#16121e;border-radius:999px;padding:8px 11px;font-size:11px}.auto i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}.new,.key{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:42px;height:40px;cursor:pointer}.chat{flex:1;min-height:0;overflow:auto;padding:18px 14px 190px}.welcome{max-width:820px;margin:12vh auto;text-align:center}.hero{width:76px;height:76px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c026d3 55%,#db2777);font-size:36px}.welcome h1{font-size:clamp(28px,5vw,48px);margin:16px 0 7px}.welcome p{color:var(--muted);line-height:1.6}.msg{display:flex;gap:8px;max-width:900px;margin:11px auto}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:#22222b}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:min(820px,91%)}.bubble{padding:11px 13px;border-radius:15px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#121218;border:1px solid #24242e}.user .bubble{background:linear-gradient(145deg,#3b2266,#2b174b);border:1px solid #55328a}.meta{font-size:9px;color:var(--muted);margin:4px 7px}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08080c 20%);z-index:10}.box{max-width:900px;margin:auto;border:1px solid #34343e;border-radius:20px;background:#141419ef;padding:7px}.row{display:flex;gap:6px;align-items:flex-end}.attach,.send{width:46px;height:46px;border:0;border-radius:14px;cursor:pointer}.attach{background:#21152f;border:1px solid #6841a0;color:#fff;font-size:20px}.send{background:#fff;color:#111;font-size:20px}.send:disabled{opacity:.45}.input{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 9px;font-size:16px}.under{display:flex;align-items:center;gap:10px;color:#777783;font-size:9px;padding:3px 7px 0}.status{margin-left:auto}.attachments{display:none;gap:7px;overflow-x:auto;padding:7px 4px 2px}.attachments.show{display:flex}.file{position:relative;min-width:76px;width:76px;height:76px;border:1px solid #34343e;border-radius:12px;background:#0d0d12;overflow:hidden}.file img{width:100%;height:100%;object-fit:cover}.file .name{position:absolute;left:4px;right:4px;bottom:4px;padding:3px 4px;background:#000b;border-radius:6px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file .x{position:absolute;right:3px;top:3px;border:0;border-radius:50%;width:21px;height:21px;background:#000c;color:#fff;cursor:pointer}.count{font-size:9px;color:#bfa4df;white-space:nowrap}.keyCard{max-width:700px;margin:18px auto;padding:16px;border:1px solid #6841a0;border-radius:18px;background:#15101d}.keyCard input{width:100%;padding:11px;border-radius:12px;border:1px solid #34343e;background:#09090d;color:#fff}.keyCard button{margin-top:8px;border:0;border-radius:12px;padding:10px 15px;background:#fff;color:#111;font-weight:700}.work{max-width:900px;margin:8px auto;color:#aaa;font-size:10px}.work b{color:#d5b8ff}@media(max-width:760px){.top{padding:9px}.chat{padding-left:9px;padding-right:9px}.composer{padding-left:9px;padding-right:9px}.auto{font-size:9px}.room{max-width:150px}.file{min-width:68px;width:68px;height:68px}}</style></head><body><div class="app"><header class="top"><select class="room" id="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="project">🚀 ห้องโปรเจกต์</option></select><div class="grow"></div><div class="auto"><i></i> Auto · Boss เลือกให้</div><button class="key" id="key" title="API Key">🔑</button><button class="new" id="new">＋</button></header><main class="chat" id="chat"></main><div class="composer"><div class="box"><div id="attachments" class="attachments"></div><div class="row"><button class="attach" id="attach" title="แนบไฟล์และรูป">📎</button><input id="files" type="file" multiple hidden><textarea id="input" class="input" placeholder="บอกเป้าหมายให้บอส…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><span>💜 Boss Core</span><span>⚡ Auto</span><span>📎 ไฟล์</span><span class="count" id="count"></span><span class="status" id="status">พร้อม</span></div></div></div></div><script>const $=id=>document.getElementById(id),chat=$("chat"),input=$("input"),send=$("send"),room=$("room"),status=$("status"),filesInput=$("files"),attachmentsEl=$("attachments"),countEl=$("count");let history=[],files=[],busy=false;const KEY='cf_openrouter_key';const histKey=()=>`cf_chat_${room.value}`;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){chat.innerHTML='';if(!history.length)chat.innerHTML='<div class="welcome"><div class="hero">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>ส่งข้อความ รูป หรือไฟล์หลายรายการพร้อมกันได้เลย</p></div>';for(const m of history){const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');let att=m.attachments?.length?'<div class="meta">📎 '+m.attachments.length+' ไฟล์</div>':'';e.innerHTML='<div class="avatar">'+(m.role==='user'?'พ':'💜')+'</div><div class="body"><div class="bubble">'+esc(m.content||'')+'</div><div class="meta">'+(m.role==='user'?'พี่นุ':'💜 Boss · '+esc(m.provider||'Agent'))+'</div>'+att+'</div>';chat.appendChild(e)}chat.scrollTop=chat.scrollHeight}function save(){localStorage.setItem(histKey(),JSON.stringify({history:history.slice(-120)}))}function load(){try{history=JSON.parse(localStorage.getItem(histKey())||'{}').history||[]}catch{history=[]}render()}function renderFiles(){attachmentsEl.innerHTML='';attachmentsEl.classList.toggle('show',files.length>0);countEl.textContent=files.length?`เลือก ${files.length} ไฟล์`:'';for(const f of files){const i=files.indexOf(f),e=document.createElement('div');e.className='file';e.innerHTML=(f.type?.startsWith('image/')?'<img alt="">':'<div style="display:grid;place-items:center;height:100%;font-size:25px">📄</div>')+'<div class="name">'+esc(f.name)+'</div><button class="x">×</button>';if(f.type?.startsWith('image/')){const img=e.querySelector('img');img.src=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(img.src)}e.querySelector('.x').onclick=()=>{files.splice(i,1);renderFiles()};attachmentsEl.appendChild(e)}}filesInput.onchange=e=>{const incoming=[...e.target.files];const roomLeft=100-files.length;if(incoming.length>roomLeft)status.textContent='จำกัด 100 ไฟล์ต่อข้อความ';files=[...files,...incoming.slice(0,roomLeft)];renderFiles();filesInput.value=''}$("attach").onclick=()=>filesInput.click();$("key").onclick=()=>{const e=document.createElement('div');e.className='keyCard';e.innerHTML='<h3>🔑 OpenRouter API Key</h3><p>คีย์จะอยู่ใน session ของเบราว์เซอร์และส่งเฉพาะตอนคุย</p><input id="ki" type="password" placeholder="sk-or-v1-…"><button id="ks">บันทึก</button>';chat.appendChild(e);chat.scrollTop=chat.scrollHeight;$("ks").onclick=()=>{const k=$("ki").value.trim();if(k)sessionStorage.setItem(KEY,k);else sessionStorage.removeItem(KEY);e.remove();status.textContent=k?'OpenRouter พร้อม':'ไม่มี OpenRouter key'}};async function toData(f){if(f.size>8*1024*1024)return {name:f.name,type:f.type,size:f.size,error:'client_limit_8mb'};return new Promise(resolve=>{const r=new FileReader;r.onload=()=>resolve({name:f.name,type:f.type||'application/octet-stream',size:f.size,data:r.result});r.onerror=()=>resolve({name:f.name,type:f.type,size:f.size,error:'read_failed'});r.readAsDataURL(f)})}async function sendMessage(){if(busy)return;const text=input.value.trim();if(!text&&!files.length)return;busy=true;send.disabled=true;status.textContent='กำลังส่ง…';const sentFiles=[...files];const meta=sentFiles.map(f=>({name:f.name,type:f.type||'application/octet-stream',size:f.size}));history.push({role:'user',content:text,attachments:meta});save();render();input.value='';files=[];renderFiles();try{const payloadFiles=await Promise.all(sentFiles.map(toData));const key=sessionStorage.getItem(KEY)||'';const r=await fetch('/api/boss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text||'วิเคราะห์ไฟล์ที่แนบมา',history:history.slice(-18),room:room.value,who:'silelo',provider:'auto',clientKeys:key?{openrouter:key}:undefined,attachments:payloadFiles,opt:{mode:'fleet',name:'พี่นุ',lang:'th',len:'normal'}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);history.push({role:'assistant',content:d.reply||d.answer||d.message||'บอสได้รับไฟล์แล้ว',provider:d.providerLabel||d.provider||'Boss Agent'});save();render();status.textContent=d.providerLabel?`พร้อม · ${d.providerLabel}`:'พร้อม'}catch(e){history.push({role:'assistant',content:'💜 Boss เชื่อมต่อไม่ได้: '+e.message,provider:'System'});save();render();status.textContent='มีปัญหา'}finally{busy=false;send.disabled=false;input.focus()}}send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});room.onchange=load;$("new").onclick=()=>{history=[];save();render();input.focus()};load();input.focus();</script></body></html>
