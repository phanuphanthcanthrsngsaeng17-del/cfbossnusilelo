<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>CF Boss · Living Chat</title><style>:root{--bg:#07070a;--panel:#111117;--line:#292933;--text:#f7f7fb;--muted:#92929f;--accent:#a855f7;--ok:#34d399;--shadow:0 18px 60px #0009}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(800px 420px at 70% -10%,#7c3aed22,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:grid;grid-template-columns:245px 1fr;overflow:hidden}.sidebar{border-right:1px solid var(--line);background:#0b0b0ff2;padding:16px 12px;display:flex;flex-direction:column;gap:10px}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 12px}.brandMark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#d11b8d);font-size:20px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.sectionLabel{font-size:9px;letter-spacing:.14em;color:#6f6f7a;padding:8px 8px 2px}.nav{display:grid;gap:4px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#c8c8d2;border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;font-size:12px}.nav button.active,.nav button:hover{background:#1a1723;border-color:#332a45;color:#fff}.memoryCard{margin-top:auto;border:1px solid var(--line);background:#111117;border-radius:14px;padding:11px}.mini{display:flex;justify-content:space-between;font-size:10px}.pill{padding:2px 6px;border-radius:999px;background:#173b2e;color:#7ee7b7;font-size:8px}.memoryCard p{font-size:10px;color:var(--muted);line-height:1.45;margin:7px 0 0}.main{min-width:0;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);background:#09090de8;z-index:5}.mobileMenu,.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:40px;height:40px;cursor:pointer}.mobileMenu{display:none}.room{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0 10px}.grow{flex:1}.auto{display:flex;align-items:center;gap:7px;border:1px solid #3a2d52;background:#16121e;border-radius:999px;padding:8px 11px;font-size:11px}.auto i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}.new{font-size:23px}.chat{flex:1;min-height:0;overflow:auto;padding:18px 14px 170px}.welcome{max-width:820px;margin:7vh auto 0;text-align:center}.heroLogo{width:76px;height:76px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c026d3 55%,#db2777);font-size:36px}.welcome h1{font-size:clamp(28px,5vw,48px);margin:16px 0 7px}.welcome p{color:var(--muted);line-height:1.6}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:20px auto}.quick button,.footerTools button{border:1px solid var(--line);background:#111117;color:#d7d7df;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:10px}.msg{display:flex;gap:8px;max-width:900px;margin:11px auto}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:#22222b}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:min(820px,91%)}.bubble{padding:11px 13px;border-radius:15px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#121218;border:1px solid #24242e}.user .bubble{background:linear-gradient(145deg,#3b2266,#2b174b);border:1px solid #55328a}.meta{font-size:9px;color:var(--muted);margin:4px 7px}.copyRow{display:flex;gap:5px;margin:5px 4px}.copyBtn{border:1px solid #2b2b35;background:#0e0e13;color:#aaaab5;border-radius:8px;padding:4px 7px;font-size:9px;cursor:pointer}.digital{max-width:900px;margin:9px auto 5px;border:1px solid #30273d;background:linear-gradient(145deg,#0d0d12,#111019);border-radius:15px;padding:9px 10px}.digitalHead{display:flex;justify-content:space-between;font-size:10px}.digitalHead strong{color:#caa7ff}.digitalGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:7px}.digitalStep{border:1px solid #27242e;border-radius:9px;padding:6px 4px;color:#686875;background:#0d0d12;font-size:8px;text-align:center}.digitalStep b{display:block;font-size:10px}.digitalStep.active{border-color:#8b5cf6;background:#171021;color:#eadcff}.digitalStep.done{border-color:#24563f;color:#9eeac9}.digitalNote{margin-top:6px;color:#9993a5;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.processing{max-width:900px;margin:7px auto;display:flex;gap:7px;align-items:center;color:#aaaab5;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1s infinite}@keyframes p{50%{opacity:.25;transform:scale(.7)}}.keyCard{max-width:700px;margin:18px auto;padding:16px;border:1px solid #6841a0;border-radius:18px;background:linear-gradient(145deg,#15101d,#0f0f14);box-shadow:0 12px 40px #0006}.keyCard h3{margin:0 0 6px;font-size:15px}.keyCard p{margin:0 0 12px;color:var(--muted);font-size:10px;line-height:1.5}.keyRow{display:flex;gap:7px}.keyInput{flex:1;min-width:0;border:1px solid #34343e;border-radius:12px;background:#09090d;color:#fff;padding:11px 12px;outline:0}.keyBtn{border:0;border-radius:12px;background:#fff;color:#111;padding:0 15px;font-weight:700;cursor:pointer}.keyStatus{font-size:9px;margin-top:8px;color:#9eeac9}.composer{position:fixed;left:245px;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08080c 20%);z-index:10}.box{max-width:900px;margin:auto;border:1px solid #34343e;border-radius:20px;background:#141419ef;padding:7px}.row{display:flex;gap:6px;align-items:flex-end}.crown{width:50px;height:50px;border:1px solid #6841a0;border-radius:15px;background:linear-gradient(145deg,#21152f,#15101d);font-size:24px;cursor:pointer}.input{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 9px;font-size:16px}.send{width:46px;height:46px;border:0;border-radius:14px;background:#fff;color:#111;font-size:20px;cursor:pointer}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:10px;color:#777783;font-size:9px;padding:3px 7px 0}.status{margin-left:auto}.footerTools{display:flex;gap:6px;margin-top:5px}.footerTools button{border-radius:8px;padding:5px 8px;font-size:9px}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobileMenu{display:block}.composer{left:0;padding-left:9px;padding-right:9px}.top{padding:9px}.chat{padding-left:9px;padding-right:9px}.digitalGrid{grid-template-columns:repeat(4,1fr)}.digitalStep:nth-child(n+5){display:none}.keyRow{flex-direction:column}.keyBtn{height:42px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandMark">💜</div><div><b>CF Bossnusilelo</b><small>Boss Home · Agent OS</small></div></div><div class="sectionLabel">Workspace</div><nav class="nav"><button class="active">💬 Chat</button><button>🧠 Memory</button><button>🤖 Agents</button><button>🧰 Tools</button><button>🧪 Sandbox</button><button>📁 Projects</button></nav><div class="sectionLabel">System</div><nav class="nav"><button>⚡ Model Router</button><button>🔄 Verify</button><button>⚙️ Settings</button></nav><div class="memoryCard"><div class="mini"><span>🧠 Continuous Memory</span><span class="pill">ACTIVE</span></div><p>บริบทของบ้านถูกเก็บต่อเนื่อง เพื่อให้ Boss ทำงานต่อได้โดยไม่ต้องเริ่มใหม่</p></div></aside><main class="main"><header class="top"><button class="mobileMenu" id="menu">☰</button><select class="room" id="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="project">🚀 ห้องโปรเจกต์</option></select><div class="grow"></div><div class="auto"><i></i> Auto · Boss เลือกให้</div><button class="new" id="new">＋</button></header><main class="chat" id="chat"></main><div class="composer"><div class="box"><div class="row"><button id="crown" class="crown" title="เรียก Boss / ใส่ API Key">👑</button><textarea id="input" class="input" placeholder="บอกเป้าหมายให้บอส…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><span>💜 Boss Core</span><span>⚡ Auto</span><span>🧰 Tools</span><span>🧠 Memory</span><span class="status" id="status">พร้อม</span></div><div class="footerTools"><button id="keyTool">🔑 API Key</button><button>📎 แนบไฟล์</button><button>🌐 Web</button><button>🧪 Sandbox</button></div></div></div></main></div><script>
const $=id=>document.getElementById(id),chat=$("chat"),input=$("input"),send=$("send"),room=$("room"),status=$("status");let history=[],busy=false;const histKey=()=>`cf_chat_${room.value}`,KEY='cf_openrouter_key';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(text,btn){navigator.clipboard?.writeText(text).then(()=>{btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent='📋 คัดลอก',1200)})}
const steps=[['🧠','คิด'],['🗺️','วางแผน'],['⚡','เลือกโมเดล'],['🧰','เครื่องมือ'],['🧠','ความจำ'],['🔧','ลงมือ'],['🧪','ตรวจสอบ']];
function digital(active=0,note='กำลังทำงาน…',done=false){let e=$("liveDigital");if(!e){e=document.createElement('div');e.id='liveDigital';e.className='digital';chat.appendChild(e)}e.innerHTML=`<div class="digitalHead"><strong>👑 BOSS DIGITAL WORKSTATION</strong><span>${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div><div class="digitalGrid">${steps.map((x,i)=>`<div class="digitalStep ${done||i<active?'done':i===active?'active':''}"><b>${x[0]}</b>${done||i<active?'✓':i===active?'…':'•'} ${x[1]}</div>`).join('')}</div><div class="digitalNote">${esc(note)}</div>`;chat.appendChild(e);chat.scrollTop=chat.scrollHeight}
function processing(t){let e=$("processing");if(!e){e=document.createElement('div');e.id='processing';e.className='processing';chat.appendChild(e)}e.innerHTML='<span class="dot"></span><span>'+esc(t)+'</span>';chat.scrollTop=chat.scrollHeight}
function showKeyCard(){const old=$("keyCard");if(old){old.remove();return}const e=document.createElement('div');e.id='keyCard';e.className='keyCard';const saved=sessionStorage.getItem(KEY)||'';e.innerHTML=`<h3>🔑 เชื่อมโมเดลผ่านแชท</h3><p>ใส่ OpenRouter API Key ตรงนี้ได้เลย ระบบจะเก็บไว้เฉพาะ session ของเบราว์เซอร์และส่งให้ /api/chat เฉพาะตอนคุย ไม่เขียนลง GitHub</p><div class="keyRow"><input id="keyInput" class="keyInput" type="password" autocomplete="off" placeholder="sk-or-v1-…" value="${esc(saved)}"><button id="saveKey" class="keyBtn">บันทึก</button></div><div id="keyStatus" class="keyStatus">${saved?'🟢 เชื่อมคีย์ไว้แล้ว':'ยังไม่ได้เชื่อมคีย์'}</div>`;chat.appendChild(e);chat.scrollTop=chat.scrollHeight;$("saveKey").onclick=()=>{const k=$("keyInput").value.trim();if(!k){sessionStorage.removeItem(KEY);$("keyStatus").textContent='ลบคีย์ออกจาก session แล้ว';status.textContent='ไม่มี OpenRouter key';return}if(k.length<20){$("keyStatus").textContent='คีย์ดูสั้นเกินไป';return}sessionStorage.setItem(KEY,k);$("keyStatus").textContent='🟢 เชื่อม OpenRouter แล้ว';status.textContent='OpenRouter พร้อม';$("keyInput").value='';$("keyInput").placeholder='••••••••••••••••';}}
function render(){chat.innerHTML='';if(!history.length){chat.innerHTML='<div class="welcome"><div class="heroLogo">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>บอกเป้าหมายได้เลย บอสจะเข้าใจ → วางแผน → เลือกโมเดล → ลงมือ → ตรวจสอบ</p><div class="quick"><button data-q="เช็กเว็บบ้านให้ครบและรายงานสิ่งที่ต้องแก้">🔍 ตรวจเว็บ</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่พร้อมใช้งาน">🧠 ตรวจโมเดล</button><button data-q="ทดสอบระบบแชทให้หน่อย">🧪 ทดสอบแชท</button></div></div>}history.forEach(m=>{if(m.role==='assistant'){const d=document.createElement('div');d.className='digital';d.innerHTML='<div class="digitalHead"><strong>👑 BOSS DIGITAL WORKSTATION</strong><span>✓</span></div><div class="digitalGrid">'+steps.map(x=>`<div class="digitalStep done"><b>${x[0]}</b>✓ ${x[1]}</div>`).join('')+'</div><div class="digitalNote">ตรวจสอบเสร็จแล้ว · พร้อมส่งคำตอบ</div>';chat.appendChild(d)}const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'bot');el.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'พี่นุ':'💜 Boss · '+esc(m.provider||'Agent')}</div>${m.role==='assistant'?'<div class="copyRow"><button class="copyBtn">📋 คัดลอก</button></div>':''}</div>`;chat.appendChild(el);if(m.role==='assistant')el.querySelector('.copyBtn').onclick=()=>copyText(m.content,el.querySelector('.copyBtn'))});chat.scrollTop=chat.scrollHeight;bindQuick()}
function bindQuick(){chat.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()})}
function save(){localStorage.setItem(histKey(),JSON.stringify({history:history.slice(-120)}))}function load(){try{history=JSON.parse(localStorage.getItem(histKey())||'{}').history||[]}catch{history=[]}render()}
async function sendMessage(){if(busy)return;const text=input.value.trim();if(!text)return;busy=true;send.disabled=true;history.push({role:'user',content:text});save();render();input.value='';digital(0,'กำลังวิเคราะห์คำขอ…');status.textContent='กำลังวิเคราะห์';try{await new Promise(r=>setTimeout(r,120));digital(1,'กำลังวางแผน…');const clientKey=sessionStorage.getItem(KEY)||'';await new Promise(r=>setTimeout(r,100));digital(2,clientKey?'ใช้ OpenRouter key ของคุณและเลือกโมเดลอัตโนมัติ…':'เลือก provider ที่พร้อมใช้งาน…');const r=await fetch('/api/boss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history:history.slice(-18),room:room.value,who:'silelo',provider:'auto',clientKeys:clientKey?{openrouter:clientKey}:undefined,opt:{mode:'fleet',name:'พี่นุ',lang:'th',len:'normal'}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);digital(3,'กำลังเลือกเครื่องมือ…');await new Promise(r=>setTimeout(r,80));digital(4,'กำลังโหลดบริบทและความจำ…');await new Promise(r=>setTimeout(r,80));digital(5,'กำลังสร้างคำตอบ…');await new Promise(r=>setTimeout(r,80));digital(6,'กำลังตรวจสอบผลลัพธ์…');const answer=d.reply||d.answer||d.message||'บอสยังไม่มีข้อความตอบกลับ';history.push({role:'assistant',content:answer,provider:d.providerLabel||d.provider||'Boss Agent',time:new Date().toLocaleTimeString('th-TH')});save();render();status.textContent=d.providerLabel?`พร้อม · ${d.providerLabel}`:'พร้อม'}catch(e){$("processing")?.remove();history.push({role:'assistant',content:'💜 Boss เชื่อมต่อไม่ได้: '+e.message,provider:'System',time:new Date().toLocaleTimeString('th-TH')});save();render();status.textContent='มีปัญหา'}finally{$("processing")?.remove();busy=false;send.disabled=false;input.focus()}}
$("crown").onclick=showKeyCard;$("keyTool").onclick=showKeyCard;send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});room.onchange=load;$("new").onclick=()=>{history=[];save();render();input.focus()};$("menu").onclick=()=>showKeyCard();load();input.focus();
</script></body></html>
