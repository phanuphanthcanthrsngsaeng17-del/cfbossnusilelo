<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>CF Boss · Living Chat</title>
<style>
:root{--bg:#07070a;--panel:#111117;--line:#292933;--text:#f7f7fb;--muted:#92929f;--accent:#a855f7;--ok:#34d399;--warn:#fbbf24;--shadow:0 18px 60px #0009}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(800px 420px at 70% -10%,#7c3aed22,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:grid;grid-template-columns:245px 1fr;overflow:hidden}.sidebar{border-right:1px solid var(--line);background:#0b0b0ff2;backdrop-filter:blur(20px);padding:16px 12px;display:flex;flex-direction:column;gap:10px}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 12px}.brandMark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#d11b8d);font-size:20px}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.sectionLabel{font-size:9px;letter-spacing:.14em;color:#6f6f7a;padding:8px 8px 2px}.nav{display:grid;gap:4px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#c8c8d2;border-radius:11px;padding:9px 10px;text-align:left;cursor:pointer;font-size:12px}.nav button.active,.nav button:hover{background:#1a1723;border-color:#332a45;color:#fff}.memoryCard{margin-top:auto;border:1px solid var(--line);background:#111117;border-radius:14px;padding:11px}.mini{display:flex;justify-content:space-between;font-size:10px}.pill{padding:2px 6px;border-radius:999px;background:#173b2e;color:#7ee7b7;font-size:8px}.memoryCard p{font-size:10px;color:var(--muted);line-height:1.45;margin:7px 0 0}.main{min-width:0;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);background:#09090de8;backdrop-filter:blur(20px);z-index:5}.mobileMenu,.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:40px;height:40px;cursor:pointer}.mobileMenu{display:none}.room{height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0 10px}.grow{flex:1}.auto{display:flex;align-items:center;gap:7px;border:1px solid #3a2d52;background:#16121e;border-radius:999px;padding:8px 11px;font-size:11px}.auto i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}.new{font-size:23px}.chat{flex:1;min-height:0;overflow:auto;padding:18px 14px 170px}.welcome{max-width:820px;margin:7vh auto 0;text-align:center}.heroLogo{width:76px;height:76px;margin:auto;border-radius:25px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c026d3 55%,#db2777);font-size:36px}.welcome h1{font-size:clamp(28px,5vw,48px);margin:16px 0 7px;letter-spacing:-.04em}.welcome p{color:var(--muted);line-height:1.6;margin:0}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:20px auto}.quick button,.footerTools button{border:1px solid var(--line);background:#111117;color:#d7d7df;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:10px}.msg{display:flex;gap:8px;max-width:900px;margin:11px auto}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:#22222b}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:min(820px,91%)}.bubble{padding:11px 13px;border-radius:15px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#121218;border:1px solid #24242e}.user .bubble{background:linear-gradient(145deg,#3b2266,#2b174b);border:1px solid #55328a}.meta{font-size:9px;color:var(--muted);margin:4px 7px}.copyRow{display:flex;gap:5px;margin:5px 4px}.copyBtn{border:1px solid #2b2b35;background:#0e0e13;color:#aaaab5;border-radius:8px;padding:4px 7px;font-size:9px;cursor:pointer}.digital{max-width:900px;margin:9px auto 5px;border:1px solid #30273d;background:linear-gradient(145deg,#0d0d12,#111019);border-radius:15px;padding:9px 10px;box-shadow:0 8px 30px #0004}.digitalHead{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#dcd6e7}.digitalHead strong{letter-spacing:.08em;color:#caa7ff}.digitalClock{font:600 11px ui-monospace,SFMono-Regular,monospace;color:#8f8a99}.digitalGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:7px}.digitalStep{border:1px solid #27242e;border-radius:9px;padding:6px 5px;color:#686875;background:#0d0d12;font-size:8px;text-align:center}.digitalStep b{display:block;font-size:10px;margin-bottom:2px}.digitalStep.active{border-color:#8b5cf6;background:#171021;color:#eadcff;box-shadow:inset 0 0 18px #8b5cf611}.digitalStep.done{border-color:#24563f;color:#9eeac9}.digitalNote{margin-top:6px;color:#9993a5;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.processing{max-width:900px;margin:7px auto;display:flex;gap:7px;align-items:center;color:#aaaab5;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px #a855f7;animation:p 1s infinite}@keyframes p{50%{opacity:.25;transform:scale(.7)}}.sandbox-result{max-width:900px;margin:8px auto;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#0d0d12;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow:auto}.ok{border-color:#166534}.err{border-color:#7f1d1d;color:#fda4af}.composer{position:fixed;left:245px;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08080c 20%);z-index:10}.box{max-width:900px;margin:auto;border:1px solid #34343e;border-radius:20px;background:#141419ef;backdrop-filter:blur(22px);box-shadow:var(--shadow);padding:7px}.row{display:flex;gap:6px;align-items:flex-end}.crown{width:50px;height:50px;border:1px solid #6841a0;border-radius:15px;background:linear-gradient(145deg,#21152f,#15101d);font-size:24px;cursor:pointer}.input{flex:1;min-height:46px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 9px;line-height:1.5;font-size:16px}.send{width:46px;height:46px;border:0;border-radius:14px;background:#fff;color:#111;font-size:20px;cursor:pointer}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:10px;color:#777783;font-size:9px;padding:3px 7px 0}.under span{white-space:nowrap}.status{margin-left:auto;color:#a5a5b0}.footerTools{display:flex;gap:6px;margin-top:5px}.footerTools button{border-radius:8px;padding:5px 8px;font-size:9px}.mobileOnly{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobileMenu{display:block}.composer{left:0;padding-left:9px;padding-right:9px}.top{padding-left:9px;padding-right:9px}.room{max-width:145px}.auto{padding:8px 9px}.chat{padding-left:9px;padding-right:9px}.body{max-width:88%}.digitalGrid{grid-template-columns:repeat(4,1fr)}.digitalStep:nth-child(n+5){display:none}.mobileOnly{display:block}}
</style>
</head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="brandMark">💜</div><div><b>CF Bossnusilelo</b><small>Boss Home · Agent OS</small></div></div><div class="sectionLabel">Workspace</div><nav class="nav"><button class="active">💬 Chat</button><button>🧠 Memory</button><button>🤖 Agents</button><button>🧰 Tools</button><button>🧪 Sandbox</button><button>📁 Projects</button><button>🧩 Templates</button></nav><div class="sectionLabel">System</div><nav class="nav"><button>⚡ Model Router</button><button>🔄 Verify</button><button>⚙️ Settings</button></nav><div class="memoryCard"><div class="mini"><span>🧠 Continuous Memory</span><span class="pill">ACTIVE</span></div><p>บริบทและการตัดสินใจของบ้านถูกเก็บต่อเนื่อง เพื่อให้ Boss ทำงานต่อได้โดยไม่ต้องเริ่มใหม่</p></div></aside>
<main class="main"><header class="top"><button class="mobileMenu" id="menu">☰</button><select class="room" id="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="project">🚀 ห้องโปรเจกต์</option></select><div class="grow"></div><div class="auto"><i></i> Auto · Boss เลือกให้</div><button class="new" id="new">＋</button></header>
<main class="chat" id="chat"></main>
<div class="composer"><div class="box"><div class="row"><button id="crown" class="crown" title="เรียก Boss">👑</button><textarea id="input" class="input" placeholder="บอกเป้าหมายให้บอส…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><span>💜 Boss Core</span><span>⚡ Auto</span><span>🧰 Tools</span><span>🧠 Memory</span><span>🧪 Verify</span><span class="status" id="status">พร้อม</span></div><div class="footerTools"><button>📎 แนบไฟล์</button><button>🌐 Web</button><button>🧪 Sandbox</button><button>🧠 Memory</button></div></div></div></main></div>
<script>
const $=id=>document.getElementById(id),chat=$("chat"),input=$("input"),send=$("send"),room=$("room"),status=$("status"),crown=$("crown");let history=[],busy=false,langs=[];const key=()=>`cf_chat_${room.value}`;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(text,btn){navigator.clipboard?.writeText(text).then(()=>{btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent='📋 คัดลอก',1200)}).catch(()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();btn.textContent='✓ คัดลอกแล้ว';setTimeout(()=>btn.textContent='📋 คัดลอก',1200)})}
const steps=[['🧠','คิด/วิเคราะห์'],['🗺️','วางแผน'],['⚡','เลือกโมเดล'],['🧰','เลือกเครื่องมือ'],['🧠','ใช้ความจำ'],['🔧','ลงมือทำ'],['🧪','ตรวจสอบ']];
function digital(active=0,note='กำลังทำงาน…',done=false){let old=$("liveDigital");if(!old){old=document.createElement('div');old.id='liveDigital';old.className='digital';chat.appendChild(old)}old.innerHTML=`<div class="digitalHead"><strong>👑 BOSS DIGITAL WORKSTATION</strong><span class="digitalClock">${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div><div class="digitalGrid">${steps.map((x,i)=>`<div class="digitalStep ${done||i<active?'done':i===active?'active':''}"><b>${x[0]}</b>${done||i<active?'✓':i===active?'…':'•'} ${x[1]}</div>`).join('')}</div><div class="digitalNote">${esc(note)}</div>`;chat.appendChild(old);chat.scrollTop=chat.scrollHeight}
function processing(t){let old=$("processing");if(old)old.remove();const e=document.createElement('div');e.id='processing';e.className='processing';e.innerHTML='<span class="dot"></span><span>'+esc(t)+'</span>';chat.appendChild(e);chat.scrollTop=chat.scrollHeight}
function renderDigitalForAnswer(){const live=$("liveDigital");if(live)live.remove();}
function render(){chat.innerHTML='';if(!history.length){chat.innerHTML='<div class="welcome"><div class="heroLogo">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>บอกเป้าหมายได้เลย บอสจะเข้าใจ → วางแผน → เลือกโมเดลและเครื่องมือ → ลงมือ → ตรวจสอบ</p><div class="quick"><button data-q="เช็กเว็บบ้านให้ครบและรายงานสิ่งที่ต้องแก้">🔍 ตรวจเว็บ</button><button data-q="สร้างบอทจาก Template ที่เหมาะที่สุดให้ผม">🤖 สร้างบอท</button><button data-q="ตรวจ Model Router และเลือกโมเดลที่เร็วและเหมาะกับงาน">🧠 ตรวจโมเดล</button><button data-q="ตรวจ Sandbox และทดสอบระบบให้หน่อย">🧪 ทดสอบ Sandbox</button></div></div>';bindQuick();return}history.forEach(m=>{if(m.role==='assistant'){const d=document.createElement('div');d.className='digital';d.innerHTML=`<div class="digitalHead"><strong>👑 BOSS DIGITAL WORKSTATION</strong><span class="digitalClock">${m.time||''}</span></div><div class="digitalGrid">${steps.map(x=>`<div class="digitalStep done"><b>${x[0]}</b>✓ ${x[1]}</div>`).join('')}</div><div class="digitalNote">ตรวจสอบเสร็จแล้ว · พร้อมส่งคำตอบ</div>`;chat.appendChild(d)}const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'bot');el.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'พี่นุ':'💜 Boss · '+(m.provider||'Agent')}</div>${m.role==='assistant'?'<div class="copyRow"><button class="copyBtn">📋 คัดลอก</button></div>':''}</div>`;chat.appendChild(el);if(m.role==='assistant')el.querySelector('.copyBtn').onclick=()=>copyText(m.content,el.querySelector('.copyBtn'))});chat.scrollTop=chat.scrollHeight}
function bindQuick(){chat.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()})}
function save(){localStorage.setItem(key(),JSON.stringify({history:history.slice(-120),updatedAt:Date.now()}))}
function load(){try{const d=JSON.parse(localStorage.getItem(key())||'{}');history=Array.isArray(d.history)?d.history:[]}catch{history=[]}render()}
function extractCode(text){const m=String(text||'').match(/```(?:[a-zA-Z0-9_+#.-]+)?\n?([\s\S]*?)```/);return m?m[1].trim():null}
function detectLanguage(text){const t=String(text||'').toLowerCase();if(t.includes('python')||t.includes('ไพธอน'))return langs.find(x=>/python/i.test(x.name))?.id;if(t.includes('javascript')||t.includes('js'))return langs.find(x=>/javascript/i.test(x.name))?.id;if(t.includes('typescript')||t.includes('ts'))return langs.find(x=>/typescript/i.test(x.name))?.id;if(t.includes('rust'))return langs.find(x=>/rust/i.test(x.name))?.id;if(t.includes('go ')||t.includes('golang'))return langs.find(x=>/^go/i.test(x.name))?.id;if(t.includes('java'))return langs.find(x=>/^java/i.test(x.name))?.id;return langs.find(x=>/python/i.test(x.name))?.id}
async function loadLangs(){try{const r=await fetch('/api/sandbox');const d=await r.json();langs=d.languages||[]}catch{}}
async function runIfRequested(text,answer){const wants=/\b(run|execute|test)\b|รัน|รันโค้ด|ทดสอบโค้ด|ให้รัน|ลองรัน/i.test(text);if(!wants)return null;const code=extractCode(answer)||extractCode(text);if(!code)return null;const id=detectLanguage(text+' '+answer);if(!id)return null;digital(5,'กำลังรันโค้ดใน Sandbox และตรวจผล…');processing('🧪 กำลังรันโค้ดและตรวจผล…');const r=await fetch('/api/sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:code,language_id:Number(id),stdin:''})});const d=await r.json();const out=[d.stdout,d.stderr,d.compile_output,d.message].filter(Boolean).join('\n')||d.status?.description||'เสร็จแล้ว';const e=document.createElement('div');e.className='sandbox-result '+(d.status?.id===3?'ok':'err');e.textContent=`🧪 Sandbox · ${d.status?.description||'ผลการรัน'}\n${out}\nเวลา ${d.time||'-'}s · memory ${d.memory||'-'} KB`;chat.appendChild(e);$("processing")?.remove();digital(7,'ตรวจ Sandbox เสร็จแล้ว',true);chat.scrollTop=chat.scrollHeight;return d}
async function sendMessage(){if(busy)return;const text=input.value.trim();if(!text)return;busy=true;send.disabled=true;history.push({role:'user',content:text});save();render();input.value='';digital(0,'กำลังวิเคราะห์คำขอ…');status.textContent='กำลังวิเคราะห์';try{await new Promise(r=>setTimeout(r,180));digital(1,'กำลังวางแผนงานและกำหนดเส้นทาง…');await new Promise(r=>setTimeout(r,120));digital(2,'กำลังเลือกโมเดลที่เหมาะสม…');const r=await fetch('/api/boss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history:history.slice(-18),room:room.value,who:'silelo',provider:'auto',opt:{mode:'fleet',name:'พี่นุ',lang:'th',len:'normal'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);digital(3,'กำลังเลือกเครื่องมือที่เหมาะกับงาน…');await new Promise(r=>setTimeout(r,100));digital(4,'กำลังโหลดบริบทและความจำที่เกี่ยวข้อง…');await new Promise(r=>setTimeout(r,100));digital(5,'กำลังทำงานและเตรียมคำตอบ…');await new Promise(r=>setTimeout(r,100));digital(6,'กำลังตรวจสอบผลลัพธ์ก่อนตอบ…');const answer=d.reply||d.answer||d.message||'บอสยังไม่มีข้อความตอบกลับ';history.push({role:'assistant',content:answer,provider:d.providerLabel||d.provider||'Boss Agent',time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});save();render();status.textContent='พร้อม';try{await runIfRequested(text,answer)}catch(e){const er=document.createElement('div');er.className='sandbox-result err';er.textContent='Sandbox error: '+e.message;chat.appendChild(er)}}catch(e){$("processing")?.remove();history.push({role:'assistant',content:'💜 Boss เชื่อมต่อไม่ได้: '+e.message,provider:'System',time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});save();render();status.textContent='มีปัญหา'}finally{$("processing")?.remove();busy=false;send.disabled=false;input.focus()}}
send.onclick=sendMessage;crown.onclick=()=>{input.focus();if(!input.value.trim())input.placeholder='👑 Boss พร้อมครับ… บอกเป้าหมายได้เลย';status.textContent='Boss พร้อม';};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});room.onchange=load;$('new').onclick=()=>{history=[];save();render();input.focus()};$('menu').onclick=()=>alert('CF Boss Home · Understand → Plan → Model Router → Tool Router → Memory → Execute → Verify');loadLangs();load();input.focus();
</script></body></html>
