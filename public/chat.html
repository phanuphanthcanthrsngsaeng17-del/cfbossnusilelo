<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>CF Bossnusilelo · Chat</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171c;--line:#303039;--text:#f5f5f7;--muted:#9b9ba6;--accent:#8b5cf6;--user:#3b2266;--ok:#22c55e;--bad:#fb7185}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0b0b0fee;backdrop-filter:blur(18px);z-index:5}.menu,.new,.send{border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}.menu,.new{width:44px;height:44px;border-radius:14px;font-size:22px}.brand{font-weight:800;font-size:17px;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:4px}.grow{flex:1}.room{height:44px;max-width:180px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0 10px}.new{font-size:28px}.chat{flex:1;min-height:0;overflow:auto;padding:22px 14px 150px}.welcome{max-width:720px;margin:12vh auto 0;text-align:center;color:var(--muted)}.logo{width:68px;height:68px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#be185d);font-size:31px}.welcome h1{color:var(--text);font-size:27px;margin:14px 0 7px}.welcome p{line-height:1.65;margin:0}.msg{display:flex;gap:10px;max-width:900px;margin:20px auto}.msg.user{justify-content:flex-end}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:#292932}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:min(820px,88%)}.bubble{padding:14px 16px;border-radius:18px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#18181d}.user .bubble{background:var(--user);border:1px solid #55328a}.meta{font-size:10px;color:var(--muted);margin:5px 8px}.processing{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px;max-width:900px;margin:12px auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite}@keyframes p{50%{opacity:.25;transform:scale(.7)}}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(9px + env(safe-area-inset-bottom));background:#111116ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10}.box{max-width:900px;margin:auto;border:1px solid #3a3a44;border-radius:23px;background:#18181d;padding:8px 8px 6px}.row{display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:46px;max-height:170px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px;line-height:1.55;font-size:16px}.send{width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:#111;font-size:21px}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;padding:3px 8px 0}.under span{white-space:nowrap}.status{margin-left:auto}.sandbox-result{max-width:900px;margin:10px auto;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#101014;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow:auto}.ok{border-color:#166534}.err{border-color:#7f1d1d;color:#fda4af}@media(max-width:600px){.brand{font-size:15px}.room{max-width:135px}.chat{padding-left:10px;padding-right:10px}.body{max-width:88%}}
</style>
</head>
<body><div class="app">
<header class="top"><button class="menu" id="menu">☰</button><div class="brand">CF Bossnusilelo<small>💜 Boss Agent · Tools · CodingFleet · Sandbox</small></div><div class="grow"></div><select class="room" id="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="project">🚀 ห้องโปรเจกต์</option></select><button class="new" id="new">＋</button></header>
<main class="chat" id="chat"><div class="welcome" id="welcome"><div class="logo">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>พิมพ์อย่างเดียวแล้วกดส่งครับ<br>บอสจะวิเคราะห์งานและเลือกเครื่องมือที่เหมาะสมให้เอง</p></div></main>
<div class="composer"><div class="box"><div class="row"><textarea id="input" class="input" placeholder="ส่งข้อความถึงบอส…" autocomplete="off"></textarea><button id="send" class="send">↑</button></div><div class="under"><span>💜 Boss Agent</span><span>🧰 Tools</span><span>🧪 Sandbox</span><span class="status" id="status">พร้อม</span></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);const chat=$('chat'),input=$('input'),send=$('send'),room=$('room'),status=$('status');let history=[],busy=false,langs=[];
const key=()=>`cf_chat_${room.value}`;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const d=JSON.parse(localStorage.getItem(key())||'{}');history=Array.isArray(d.history)?d.history:[]}catch{history=[]}render()}
function save(){localStorage.setItem(key(),JSON.stringify({history:history.slice(-100)}))}
function render(){chat.innerHTML='';if(!history.length){chat.innerHTML='<div class="welcome"><div class="logo">💜</div><h1>มีอะไรให้บอสทำ?</h1><p>พิมพ์อย่างเดียวแล้วกดส่งครับ<br>บอสจะวิเคราะห์งานและเลือกเครื่องมือที่เหมาะสมให้เอง</p></div>';return}history.forEach(m=>{const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'bot');el.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'💜'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'พี่นุ':'💜 Boss · '+(m.provider||'Agent')}</div></div>`;chat.appendChild(el)});chat.scrollTop=chat.scrollHeight}
function processing(t){const old=$('processing');if(old)old.remove();const e=document.createElement('div');e.className='processing';e.id='processing';e.innerHTML='<span class="dot"></span><span>'+esc(t)+'</span>';chat.appendChild(e);chat.scrollTop=chat.scrollHeight}
function extractCode(text){const m=String(text||'').match(/```(?:[a-zA-Z0-9_+#.-]+)?\n?([\s\S]*?)```/);return m?m[1].trim():null}
function detectLanguage(text){const t=String(text||'').toLowerCase();if(t.includes('python')||t.includes('ไพธอน'))return langs.find(x=>/python/i.test(x.name))?.id;if(t.includes('javascript')||t.includes('js'))return langs.find(x=>/javascript/i.test(x.name))?.id;if(t.includes('typescript')||t.includes('ts'))return langs.find(x=>/typescript/i.test(x.name))?.id;if(t.includes('rust'))return langs.find(x=>/rust/i.test(x.name))?.id;if(t.includes('go ')||t.includes('golang'))return langs.find(x=>/^go/i.test(x.name))?.id;if(t.includes('java'))return langs.find(x=>/^java/i.test(x.name))?.id;return langs.find(x=>/python/i.test(x.name))?.id}
async function loadLangs(){try{const r=await fetch('/api/sandbox');const d=await r.json();langs=d.languages||[]}catch{}}
async function runIfRequested(text,answer){const wants=/\b(run|execute|test)\b|รัน|รันโค้ด|ทดสอบโค้ด|ให้รัน|ลองรัน/i.test(text);if(!wants)return null;const code=extractCode(answer)||extractCode(text);if(!code)return null;const id=detectLanguage(text+' '+answer);if(!id)return null;processing('กำลังรันโค้ดใน Sandbox…');const r=await fetch('/api/sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:code,language_id:Number(id),stdin:''})});const d=await r.json();const out=[d.stdout,d.stderr,d.compile_output,d.message].filter(Boolean).join('\n')||d.status?.description||'เสร็จแล้ว';const e=document.createElement('div');e.className='sandbox-result '+(d.status?.id===3?'ok':'err');e.textContent=`🧪 Sandbox · ${d.status?.description||'ผลการรัน'}\n${out}\nเวลา ${d.time||'-'}s · memory ${d.memory||'-'} KB`;chat.appendChild(e);$('processing')?.remove();chat.scrollTop=chat.scrollHeight;return d}
async function sendMessage(){if(busy)return;const text=input.value.trim();if(!text)return;busy=true;send.disabled=true;history.push({role:'user',content:text});save();render();input.value='';processing('💜 Boss กำลังวิเคราะห์งานและเลือกเครื่องมือ…');status.textContent='Boss กำลังทำงาน';try{const r=await fetch('/api/boss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,history:history.slice(-14),room:room.value,who:'silelo',provider:'auto',opt:{mode:'fleet',name:'พี่นุ',lang:'th',len:'normal'}})});const d=await r.json();$('processing')?.remove();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const answer=d.reply||d.answer||d.message||'บอสยังไม่มีข้อความตอบกลับ';history.push({role:'assistant',content:answer,provider:d.providerLabel||d.provider||'Boss Agent'});save();render();status.textContent='พร้อม';try{await runIfRequested(text,answer)}catch(e){$('processing')?.remove();const er=document.createElement('div');er.className='sandbox-result err';er.textContent='Sandbox error: '+e.message;chat.appendChild(er)}}catch(e){$('processing')?.remove();history.push({role:'assistant',content:'💜 Boss เชื่อมต่อไม่ได้: '+e.message});save();render();status.textContent='มีปัญหา'}finally{busy=false;send.disabled=false;input.focus()}}
send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});room.onchange=load;$('new').onclick=()=>{history=[];save();render();input.focus()};$('menu').onclick=()=>alert('CF Boss Home: Boss Agent เป็นคนเลือกเครื่องมือและตรวจผลลัพธ์');loadLangs();load();input.focus();
</script></body></html>
