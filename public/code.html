<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><title>CF Code Runner</title><style>:root{--bg:#0b0b0f;--panel:#17171c;--line:#30303a;--text:#f5f5f7;--muted:#9b9ba7;--accent:#a78bfa;--good:#22c55e;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100dvh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0b0ff5;backdrop-filter:blur(18px);z-index:5}.back,.run{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;height:44px;padding:0 14px;font-size:15px}.back{font-size:22px}.title{font-weight:800}.title small{display:block;color:var(--muted);font-weight:500;font-size:11px}.grow{flex:1}.run{background:#fff;color:#111;font-weight:800}.wrap{width:min(1100px,100%);margin:auto;padding:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.select,.input{height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:0 12px}.select{min-width:210px}.count{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}.label{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.editor,.stdin{width:100%;border:0;outline:0;background:#101014;color:#f5f5f7;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;padding:14px;min-height:390px}.stdin{min-height:150px}.output{white-space:pre-wrap;overflow:auto;min-height:240px;max-height:430px;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.ok{color:#86efac}.err{color:#fca5a5}.meta{padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.editor{min-height:300px}.select{flex:1}.run{margin-left:auto}}</style></head><body><div class="app"><header class="top"><button class="back" onclick="location.href='/'">‹</button><div class="title">CF Code Runner<small>รันโค้ด 60+ ภาษา • sandboxed execution</small></div><div class="grow"></div><button id="run" class="run">▶ รัน</button></header><main class="wrap"><div class="bar"><select id="lang" class="select"><option>กำลังโหลดภาษา…</option></select><span id="count" class="count">กำลังโหลด…</span></div><div class="grid"><section class="panel"><div class="label">โค้ด</div><textarea id="code" class="editor" spellcheck="false">print("Hello from CF Bossnusilelo!")</textarea></section><section><div class="panel"><div class="label">Input / stdin</div><textarea id="stdin" class="stdin" placeholder="ข้อมูลที่โปรแกรมต้องรับ"></textarea></div><div class="panel" style="margin-top:12px"><div class="label">ผลลัพธ์</div><div id="out" class="output">พร้อมรัน</div><div id="meta" class="meta">เลือกภาษาแล้วกด ▶ รัน</div></div></section></div></main></div><script>const lang=document.getElementById('lang'),code=document.getElementById('code'),stdin=document.getElementById('stdin'),out=document.getElementById('out'),meta=document.getElementById('meta'),run=document.getElementById('run'),count=document.getElementById('count');let languages=[];async function load(){try{const r=await fetch('/api/run');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'โหลดภาษาไม่สำเร็จ');languages=d.languages.filter(x=>!x.is_archived);lang.innerHTML=languages.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const py=languages.find(x=>/^Python \(/i.test(x.name));if(py)lang.value=py.id;count.textContent=`พร้อมใช้งาน ${languages.length}+ ภาษา`}catch(e){lang.innerHTML='<option>โหลดไม่ได้</option>';count.textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}run.onclick=async()=>{if(!code.value.trim())return;run.disabled=true;run.textContent='⏳ กำลังรัน…';out.textContent='กำลังประมวลผล…';out.className='output';meta.textContent='กำลังส่งเข้า sandbox';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language_id:Number(lang.value),source_code:code.value,stdin:stdin.value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'รันไม่สำเร็จ');const pieces=[];if(d.compile_output)pieces.push('--- compile ---\n'+d.compile_output);if(d.stdout)pieces.push(d.stdout);if(d.stderr)pieces.push('--- stderr ---\n'+d.stderr);if(d.message)pieces.push('--- message ---\n'+d.message);out.textContent=pieces.join('\n')||'(ไม่มี output)';out.className='output '+((d.status?.id===3)?'ok':'err');meta.textContent=`${d.language} • ${d.status?.description||'เสร็จแล้ว'}${d.time?` • ${d.time}s`:''}${d.memory?` • ${d.memory} KB`:''}`}catch(e){out.textContent=e.message;out.className='output err';meta.textContent='ตรวจการตั้งค่า JUDGE0_URL / JUDGE0_AUTH_TOKEN หาก runner ไม่พร้อม'}finally{run.disabled=false;run.textContent='▶ รัน'}};load();</script></body></html>
