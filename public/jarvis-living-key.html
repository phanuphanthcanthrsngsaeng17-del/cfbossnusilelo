<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>CF Boss · Living</title><style>:root{--bg:#05070c;--panel:#071019;--line:#29475a;--text:#edf8ff;--muted:#7891a1;--cyan:#72e9ff;--gold:#bdf7ff;--purple:#191126}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}button,input,textarea{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) auto;background:radial-gradient(circle at 50% 0,#0d2433 0,#05070c 42%,#020307 100%)}.top{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:#05080ddd;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.orb{width:36px;height:36px;border:1px solid #52ddff99;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px #28dfff33}.orb:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}.brand small{display:block;color:var(--muted);font:8px monospace}.grow{flex:1}.live{font:8px monospace;color:#54e6ae}.tool,.crown,.send{border-radius:11px;cursor:pointer}.tool{width:38px;height:38px;border:1px solid var(--line);background:#081019;color:var(--text);font-size:20px}.chat{min-height:0;overflow:auto;padding:14px 10px 18px}.stream{width:min(860px,100%);margin:auto}.welcome{text-align:center;padding:6vh 15px 18px}.welcome h1{font-size:30px;margin:14px 0 5px}.welcome p{max-width:600px;margin:auto;color:var(--muted);font-size:12px;line-height:1.6}.msg{display:flex;gap:7px;margin:9px 0;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:9px;background:#08121b;display:grid;place-items:center}.user .avatar{order:2;background:var(--purple)}.body{max-width:min(90%,760px)}.bubble{border:1px solid var(--line);background:#081019;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--purple);border-color:#4b3270}.meta{margin:3px 5px;color:#5d7787;font:8px monospace}.actions{display:flex;gap:5px;margin:3px 4px}.mini{border:1px solid var(--line);background:#081019;color:#c9dbe5;border-radius:9px;padding:4px 7px;font-size:9px}.work{border:1px solid #27536a;background:#061018f5;border-radius:14px;padding:9px;margin:10px auto;width:min(860px,100%)}.wh{display:flex;justify-content:space-between;color:var(--cyan);font:9px monospace}.digits{text-align:center;font:700 25px ui-monospace,monospace;margin:4px}.stages{display:flex;gap:4px;overflow:auto}.stages span{white-space:nowrap;border:1px solid #183442;border-radius:7px;padding:4px 6px;color:#567181;font-size:8px}.stages .on{color:#d2fbff;background:#0b2732;border-color:#3e91ab}.note{margin-top:4px;color:#6d8797;font-size:8px}.composer-wrap{border-top:1px solid var(--line);background:#05080df5;padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:6}.composer{width:min(900px,100%);margin:auto;border:1px solid #29475a;border-radius:16px;background:#071019f7}.keybar{display:none;padding:9px;border-bottom:1px solid var(--line);background:#061018;border-radius:16px 16px 0 0}.keybar.open{display:block}.keytitle{display:flex;justify-content:space-between;align-items:center;color:var(--cyan);font-weight:800;font-size:12px}.keygrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.keygrid input,.keygrid select{width:100%;background:#03070b;border:1px solid var(--line);border-radius:9px;color:#fff;padding:9px;outline:0}.keygrid .wide{grid-column:1/-1}.keyactions{display:flex;gap:6px;margin-top:7px}.keyactions button{flex:1;border:1px solid #37647c;background:#0b2431;color:#c9f8ff;border-radius:9px;padding:9px}.keyhint{font:8px monospace;color:#6f8998;margin-top:6px;line-height:1.5}.row{display:flex;gap:6px;align-items:flex-end;padding:6px}.input{flex:1;min-width:0;min-height:42px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px;font-size:16px}.crown,.send{width:44px;height:44px;flex:none}.crown{border:1px solid #684b9c;background:#171026;color:white;font-size:21px}.send{border:1px solid #8fefff;background:#bdf7ff;color:#031018;font-size:20px}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:5px;overflow:auto;padding:0 7px 6px}.chip{white-space:nowrap;border:1px solid var(--line);background:#081019;color:#c9dbe5;border-radius:9px;padding:5px 8px;font-size:9px}.status{margin-left:auto;white-space:nowrap;color:#6f8998;font:8px monospace}.keychip{border-color:#4b3270;color:#e7d8ff}.sheet{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:20;padding:15px}.sheet.open{display:grid}.panel{width:min(520px,100%);border:1px solid #31566c;background:#071019;border-radius:16px;padding:14px}.panel h3{margin:0;color:var(--cyan)}.panel p{color:var(--muted);font-size:11px;line-height:1.5}.close{width:100%;border:1px solid var(--line);background:#0b1720;color:#c9f8ff;border-radius:9px;padding:9px}@media(max-width:520px){.keygrid{grid-template-columns:1fr}.keygrid .wide{grid-column:auto}.live{display:none}.body{max-width:92%}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="orb"></div><div>CF BOSS<small>JARVIS LIVING · COMMAND CENTER</small></div></div><div class="grow"></div><div class="live">● ONLINE · AUTO</div><button class="tool" id="tools">＋</button></header><main class="chat" id="chat"><div class="stream" id="stream"></div></main><footer class="composer-wrap"><div class="composer"><div class="keybar" id="keybar"><div class="keytitle"><span>🔐 AI KEY VAULT · ในห้องแชท</span><button class="chip" id="closeKey">ปิด</button></div><div class="keygrid"><input id="orKey" class="wide" type="password" autocomplete="off" placeholder="วาง OpenRouter API Key ตรงนี้"><select id="model"><option value="openai/gpt-5.4-mini">GPT-5.4 Mini</option><option value="deepseek/deepseek-chat-v3-03:free">DeepSeek V3 03 · Free</option><option value="qwen/qwen-2.5-72b-instruct">Qwen 2.5 72B</option><option value="meta-llama/llama-3.1-70b-instruct:free">Llama 3.1 70B · Free</option><option value="google/gemini-2.0-flash">Gemini 2.0 Flash</option><option value="openrouter/free">Auto · OpenRouter Free</option></select><input id="label" type="text" autocomplete="off" placeholder="ชื่อคีย์ เช่น Main AI"></div><div class="keyactions"><button id="saveKey">บันทึกคีย์</button><button id="testKey">ทดสอบคีย์</button></div><div class="keyhint" id="keyStatus">คีย์เก็บในเครื่องนี้และส่งผ่าน HTTPS ตอนเรียก AI เท่านั้น ไม่เขียนลง source code</div></div><div class="row"><button class="crown" id="crown">🔑</button><textarea id="input" class="input" rows="1" placeholder="บอกเป้าหมายให้ Boss…"></textarea><button id="send" class="send">↑</button></div><div class="under"><button class="chip">🌐 Web</button><button class="chip">🚗 Fleet</button><button class="chip">🧠 Memory</button><button class="chip">🧪 Verify</button><button class="chip keychip" id="keyButton">🔑 ใส่คีย์</button><span class="status" id="status">พร้อม · Auto</span></div></div></footer></div><div class="sheet" id="sheet"><div class="panel"><h3>⚡ BOSS COMMAND DECK</h3><p>ห้องนี้เป็นตัวควบคุมหลักของ Boss สามารถเปิด AI Key Vault ได้ตลอดโดยไม่ต้องออกจากแชท</p><button class="close" id="close">ปิด</button></div></div><script>const $=id=>document.getElementById(id),input=$('input'),send=$('send'),stream=$('stream'),chat=$('chat'),status=$('status'),keybar=$('keybar'),KEY='cf_openrouter_key',MODEL='cf_model';let history=[],busy=false;try{history=JSON.parse(localStorage.getItem('cf_living_chat')||'[]')}catch{}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)))}function render(){stream.innerHTML='';if(!history.length){stream.innerHTML='<div class="welcome"><div class="orb" style="width:70px;height:70px;margin:auto"></div><h1>Boss พร้อมครับ 👑</h1><p>คุยในห้องนี้ได้เลย · 🔑 ใส่คีย์ได้จากปุ่มด้านล่าง · เลือกโมเดลได้โดยไม่ต้องออกจากแชท</p></div>'}history.forEach((m,i)=>{const e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML='<div class="avatar">'+(m.role==='user'?'พ':'👑')+'</div><div class="body"><div class="bubble">'+esc(m.content)+'</div><div class="meta">'+(m.role==='user'?'USER':'BOSS · '+esc(m.provider||'Auto'))+'</div>'+(m.role==='assistant'?'<div class="actions"><button class="mini" data-copy="'+i+'">📋 คัดลอก</button><button class="mini" data-retry="'+i+'">↻ ลองใหม่</button></div>':'')+'</div>';stream.appendChild(e)});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(history[+b.dataset.copy].content);b.textContent='✓ คัดลอกแล้ว'});document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const q=history.slice(0,+b.dataset.retry).reverse().find(x=>x.role==='user');if(q){input.value=q.content;ask()}});chat.scrollTop=chat.scrollHeight}function openKeys(){keybar.classList.add('open');const k=localStorage.getItem(KEY)||'';$('orKey').value='';$('model').value=localStorage.getItem(MODEL)||'openai/gpt-5.4-mini';$('keyStatus').textContent=k?'🟢 มีคีย์บันทึกไว้แล้ว · แก้ไขได้ทันที':'ยังไม่ได้ใส่ OpenRouter Key';$('orKey').focus()}function closeKeys(){keybar.classList.remove('open')}function saveKey(){const k=$('orKey').value.trim();if(k){if(k.length<20){$('keyStatus').textContent='⚠️ คีย์สั้นผิดปกติ';return}localStorage.setItem(KEY,k)}localStorage.setItem(MODEL,$('model').value);$('keyStatus').textContent=localStorage.getItem(KEY)?'🟢 บันทึกคีย์ + โมเดลแล้ว':'⚠️ ยังไม่มีคีย์';status.textContent=localStorage.getItem(KEY)?'OpenRouter พร้อม':'ยังไม่มีคีย์'}async function testKey(){const k=$('orKey').value.trim()||localStorage.getItem(KEY)||'';if(!k){$('keyStatus').textContent='⚠️ ใส่คีย์ก่อน';return}$('keyStatus').textContent='⏳ กำลังทดสอบ…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:'ตอบสั้น ๆ ว่า OK',history:[],room:'living',who:'silelo',provider:'openrouter',model:$('model').value,clientKeys:{openrouter:k},opt:{lang:'th',len:'short',mode:'chat'}})});const d=await r.json().catch(()=>({}));$('keyStatus').textContent=r.ok?'🟢 คีย์ใช้ได้ · '+(d.model||$('model').value):'🔴 ใช้ไม่ได้ · '+(d.error||'provider error')}catch(e){$('keyStatus').textContent='🔴 เชื่อมต่อ API ไม่สำเร็จ'}}function work(){const e=document.createElement('div');e.className='work';e.innerHTML='<div class="wh"><span>👑 BOSS DIGITAL WORKSTATION</span><span id="ws">RUNNING</span></div><div class="digits" id="digits">0.000 s</div><div class="stages"><span>🧠 วิเคราะห์</span><span>🗺️ วางแผน</span><span>⚡ โมเดล</span><span>🧰 เครื่องมือ</span><span>🧪 ตรวจสอบ</span><span>✅ เสร็จ</span></div><div class="note" id="note">กำลังทำงาน…</div></div>';stream.appendChild(e);return e}function stage(n,s){document.querySelectorAll('.stages span').forEach((x,i)=>x.className=i<n?'on':'');if($('ws'))$('ws').textContent=s;if($('note'))$('note').textContent=s}async function ask(){if(busy)return;const q=input.value.trim();if(!q)return;busy=true;history.push({role:'user',content:q});save();render();input.value='';send.disabled=true;const w=work(),t=performance.now(),timer=setInterval(()=>{if($('digits'))$('digits').textContent=((performance.now()-t)/1000).toFixed(3)+' s'},40);try{const k=localStorage.getItem(KEY)||'';const model=localStorage.getItem(MODEL)||'openai/gpt-5.4-mini';status.textContent=k?'🧠 '+model.split('/').pop():'⚠️ ยังไม่มีคีย์';stage(1,'ANALYZE');stage(2,'PLAN');stage(3,k?'OPENROUTER':'NO KEY');const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(0,-1).slice(-18),room:'living',who:'silelo',provider:k?'openrouter':'auto',model:k?model:'',clientKeys:k?{openrouter:k}:undefined,opt:{lang:'th',len:'normal',mode:'chat'}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error((d.error||'Boss API ไม่ตอบสนอง')+(d.details?' · '+d.details.join(' | '):''));stage(4,'VERIFY');history.push({role:'assistant',content:d.reply||d.message||'บอสไม่มีคำตอบ',provider:d.providerLabel||d.provider||'Auto'});save();stage(6,'COMPLETE');status.textContent='✅ '+(d.model||d.providerLabel||'Auto')}catch(e){history.push({role:'assistant',content:'⚠️ '+e.message,provider:'System'});save();status.textContent='🔴 Provider Error';stage(6,'FAILED')}finally{clearInterval(timer);send.disabled=false;busy=false;render()}}$('crown').onclick=openKeys;$('keyButton').onclick=openKeys;$('closeKey').onclick=closeKeys;$('saveKey').onclick=saveKey;$('testKey').onclick=testKey;$('send').onclick=ask;$('tools').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});render();</script></body></html>
