<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>CF Boss · Living</title><style>:root{--bg:#05070c;--panel:#0a1018;--line:#203241;--text:#edf8ff;--muted:#7891a1;--cyan:#72e9ff;--green:#54e6ae}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}button,textarea,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) auto;background:radial-gradient(circle at 50% 0,#0d2433 0,#05070c 42%,#020307 100%)}.top{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:#05080ddd;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.orb{width:36px;height:36px;border:1px solid #52ddff99;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px #28dfff33}.orb:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan);animation:p 1.3s infinite}@keyframes p{50%{opacity:.25;transform:scale(.7)}}.brand small{display:block;color:var(--muted);font:8px monospace}.grow{flex:1}.live{font:8px monospace;color:var(--green)}.tool,.crown,.send{border-radius:11px;cursor:pointer}.tool{width:38px;height:38px;border:1px solid var(--line);background:#081019;color:var(--text);font-size:20px}.chat{min-height:0;overflow:auto;padding:14px 10px 18px}.stream{width:min(860px,100%);margin:auto}.welcome{text-align:center;padding:8vh 15px 18px}.welcome h1{font-size:34px;margin:14px 0 5px}.welcome p{max-width:560px;margin:auto;color:var(--muted);font-size:12px;line-height:1.6}.keyCard{margin:18px auto 0;text-align:left;width:min(620px,100%);border:1px solid #31566c;background:#071019;border-radius:16px;padding:13px}.keyCard b{color:var(--cyan)}.keyCard small{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:6px}.keyRow{display:flex;gap:6px;margin-top:8px}.keyRow input{flex:1;min-width:0;background:#03070b;border:1px solid var(--line);border-radius:9px;color:#fff;padding:10px}.keyRow button{border:1px solid #37647c;background:#0b2431;color:#c9f8ff;border-radius:9px;padding:0 14px}.keyStatus{font:9px monospace;color:#6f8998;margin-top:7px}.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}.btn,.chip,.copy,.retry{border:1px solid var(--line);background:#081019;color:#c9dbe5;border-radius:9px;padding:7px 10px;font-size:10px}.msg{display:flex;gap:7px;margin:9px 0;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:9px;background:#08121b;display:grid;place-items:center}.user .avatar{order:2;background:#1b1227}.body{max-width:min(88%,760px)}.bubble{border:1px solid var(--line);background:#081019;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#191126;border-color:#4b3270}.meta{margin:3px 5px;color:#5d7787;font:8px monospace}.actions{display:flex;gap:5px;margin:3px 4px}.copy,.retry{font-size:9px;padding:4px 7px}.work{border:1px solid #27536a;background:#061018f5;border-radius:14px;padding:9px;margin:10px auto;width:min(860px,100%)}.wh{display:flex;justify-content:space-between;color:var(--cyan);font:9px monospace}.digits{text-align:center;font:700 29px ui-monospace,monospace;margin:4px}.stages{display:flex;gap:4px;overflow:auto}.stages span{white-space:nowrap;border:1px solid #183442;border-radius:7px;padding:4px 6px;color:#567181;font-size:8px}.stages .on{color:#d2fbff;background:#0b2732;border-color:#3e91ab}.note{margin-top:4px;color:#6d8797;font-size:8px}.composer-wrap{border-top:1px solid var(--line);background:#05080ddd;padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:6}.composer{width:min(900px,100%);margin:auto;border:1px solid #29475a;border-radius:16px;background:#071019f7}.row{display:flex;gap:6px;align-items:flex-end;padding:6px}.input{flex:1;min-width:0;min-height:42px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px;font-size:16px}.crown,.send{width:44px;height:44px;flex:none}.crown{border:1px solid #684b9c;background:#171026;color:white;font-size:21px}.send{border:1px solid #8fefff;background:#bdf7ff;color:#031018;font-size:20px}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:5px;overflow:auto;padding:0 7px 6px}.chip{white-space:nowrap;font-size:9px;padding:4px 7px}.status{margin-left:auto;white-space:nowrap;color:#6f8998;font:8px monospace}.sheet{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:20;padding:15px}.sheet.open{display:grid}.panel{width:min(520px,100%);border:1px solid #31566c;background:#071019;border-radius:16px;padding:14px}.panel h3{margin:0;color:var(--cyan)}.deck{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.close{width:100%;margin-top:8px;border:1px solid var(--line);background:#0b1720;color:#c9f8ff;border-radius:9px;padding:9px}@media(max-width:520px){.live{display:none}.welcome h1{font-size:29px}.keyRow{flex-direction:column}.keyRow button{height:42px}.deck{grid-template-columns:1fr}.body{max-width:90%}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="orb"></div><div>CF BOSS<small>JARVIS LIVING · COMMAND CENTER</small></div></div><div class="grow"></div><div class="live">● ONLINE · AUTO</div><button class="tool" id="tools">＋</button></header><main class="chat" id="chat"><div class="stream" id="stream"></div></main><footer class="composer-wrap"><div class="composer"><div class="row"><button class="crown" id="crown">👑</button><textarea id="input" class="input" rows="1" placeholder="บอกเป้าหมายให้ Boss…"></textarea><button id="send" class="send">↑</button></div><div class="under"><button class="chip">🌐 Web</button><button class="chip">🚗 Fleet</button><button class="chip">🧠 Memory</button><button class="chip">🧪 Verify</button><span class="status" id="status">พร้อม · Auto</span></div></div></footer></div><div class="sheet" id="sheet"><div class="panel"><h3>⚡ BOSS COMMAND DECK</h3><div class="deck"><button class="btn" data-q="ตรวจบ้าน CF Boss ทั้งระบบ แล้วหาสิ่งที่ควรแก้">👀 ตรวจบ้าน</button><button class="btn" data-q="ใช้ CodingFleet วางแผนและทำงานนี้ให้ครบ">🚗 CodingFleet</button><button class="btn" data-q="ตรวจ Model Router และ provider ที่พร้อมใช้งาน">🧠 Model Router</button><button class="btn" data-q="ตรวจ Tool Registry และหาเครื่องมือที่ควรเพิ่ม">🧰 Tool Registry</button></div><button class="close" id="close">ปิด</button></div></div><script>
const $=id=>document.getElementById(id),input=$('input'),send=$('send'),stream=$('stream'),chat=$('chat'),status=$('status'),KEY='cf_openrouter_key';let history=[],busy=false;try{history=JSON.parse(localStorage.getItem('cf_living_chat')||'[]')}catch{}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)))}
function keyCard(){return `<div class="keyCard"><b>🔑 OpenRouter API Key</b><div class="keyRow"><input id="orKey" type="password" autocomplete="off" placeholder="ใส่ OpenRouter API Key ตรงนี้"><button id="saveKey">บันทึกคีย์</button></div><small>คีย์จะอยู่ในเบราว์เซอร์ของบอสและส่งผ่าน HTTPS เฉพาะตอนเรียก AI ไม่ถูกใส่ใน GitHub/source code</small><div class="keyStatus" id="keyStatus">${localStorage.getItem(KEY)?'🟢 มีคีย์ที่บันทึกไว้แล้ว':'ยังไม่ได้เชื่อม OpenRouter'}</div></div>`}
function render(){stream.innerHTML='';if(!history.length){stream.innerHTML=`<div class="welcome"><div class="orb" style="width:70px;height:70px;margin:auto"></div><h1>Boss พร้อมครับ 👑</h1><p>คุยในห้องนี้ได้เลย บอสจะวิเคราะห์ → วางแผน → เลือกโมเดล → ลงมือ → ตรวจสอบ</p>${keyCard()}<div class="quick"><button class="btn" data-q="ตรวจบ้าน CF Boss ทั้งระบบ แล้วหาสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button class="btn" data-q="ปรับหน้าแชทให้ใช้งานง่ายและเร็ว">⚡ ปรับระบบ</button><button class="btn" data-q="ตรวจ Model Router และ provider ที่พร้อมใช้งาน">🧠 ตรวจโมเดล</button></div></div>`;bind();wireKey();return}history.forEach((m,i)=>{let e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'👑'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'USER':'BOSS · '+(m.provider||'Auto')}</div>${m.role==='assistant'?'<div class="actions"><button class="copy" data-i="'+i+'">📋 คัดลอก</button><button class="retry" data-i="'+i+'">↻ ลองใหม่</button></div>':''}</div>`;stream.appendChild(e)});document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(history[+b.dataset.i].content);b.textContent='✓ คัดลอกแล้ว';setTimeout(()=>b.textContent='📋 คัดลอก',900)});document.querySelectorAll('.retry').forEach(b=>b.onclick=()=>{let q=history.slice(0,+b.dataset.i).reverse().find(x=>x.role==='user');if(q){input.value=q.content;ask()}});chat.scrollTop=chat.scrollHeight}
function wireKey(){let b=$('saveKey');if(!b)return;b.onclick=()=>{let k=$('orKey').value.trim();if(k.length<20){$('keyStatus').textContent='⚠️ คีย์ดูไม่ถูกต้อง';return}localStorage.setItem(KEY,k);$('orKey').value='';$('keyStatus').textContent='🟢 เชื่อม OpenRouter แล้ว';status.textContent='OpenRouter พร้อม'}}function bind(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;ask()})}
function work(){let e=document.createElement('div');e.className='work';e.innerHTML='<div class="wh"><span>👑 BOSS DIGITAL WORKSTATION</span><span id="ws">RUNNING</span></div><div class="digits" id="digits">0.000 s</div><div class="stages"><span>🧠 วิเคราะห์</span><span>🗺️ วางแผน</span><span>⚡ โมเดล</span><span>🧰 เครื่องมือ</span><span>🔧 ลงมือ</span><span>🧪 ตรวจสอบ</span><span>✅ เสร็จ</span></div><div class="note" id="note">กำลังทำงาน…</div></div>';stream.appendChild(e);return e}function stage(n,s){document.querySelectorAll('.stages span').forEach((x,i)=>x.className=i<n?'on':'');if($('ws'))$('ws').textContent=s;if($('note'))$('note').textContent=s}
async function ask(){if(busy)return;let q=input.value.trim();if(!q)return;busy=true;history.push({role:'user',content:q});save();render();input.value='';send.disabled=true;let w=work(),t=performance.now(),timer=setInterval(()=>{if($('digits'))$('digits').textContent=((performance.now()-t)/1000).toFixed(3)+' s'},40);try{status.textContent='🧠 กำลังวิเคราะห์…';stage(1,'ANALYZE');stage(2,'PLAN');let k=localStorage.getItem(KEY)||'';stage(3,k?'OPENROUTER':'AUTO');let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:history.slice(0,-1).slice(-18),room:'living',who:'silelo',provider:'auto',model:'',clientKeys:k?{openrouter:k}:undefined,opt:{lang:'th',len:'normal',mode:'agent'}})});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Boss API ไม่ตอบสนอง');stage(4,'TOOLS');stage(5,'VERIFY');history.push({role:'assistant',content:d.reply||d.message||'บอสไม่มีคำตอบ',provider:d.providerLabel||d.provider||'Auto'});save();stage(7,'COMPLETE');status.textContent='✅ เสร็จแล้ว · '+(d.providerLabel||'Auto');render()}catch(e){history.push({role:'assistant',content:'⚠️ '+e.message,provider:'System'});save();status.textContent='⚠️ ต้องลองใหม่';render()}finally{clearInterval(timer);busy=false;send.disabled=false;input.focus()}}
$('send').onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});$('crown').onclick=()=>{input.focus();status.textContent='👑 Boss พร้อมครับ'};$('tools').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');render();input.focus();
</script></body></html>
