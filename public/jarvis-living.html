<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>CF Boss · Living</title><style>:root{--bg:#05070c;--panel:#0a1018;--line:#203241;--text:#edf8ff;--muted:#7891a1;--cyan:#72e9ff;--green:#54e6ae;--purple:#a96cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}button,textarea,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) auto;background:radial-gradient(circle at 50% 0,#0d2433 0,#05070c 42%,#020307 100%)}.top{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:#05080ddd;backdrop-filter:blur(18px);z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.orb{width:36px;height:36px;border:1px solid #52ddff99;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px #28dfff33}.orb:after{content:"";width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan);animation:p 1.3s infinite}@keyframes p{50%{opacity:.25;transform:scale(.7)}}.brand small{display:block;color:var(--muted);font:8px monospace;letter-spacing:.08em}.grow{flex:1}.live{font:8px monospace;color:var(--green)}.tool{width:38px;height:38px;border:1px solid var(--line);background:#081019;color:var(--text);border-radius:11px;font-size:20px}.chat{min-height:0;overflow:auto;padding:14px 10px 18px;scroll-behavior:smooth}.stream{width:min(860px,100%);margin:auto}.welcome{text-align:center;padding:12vh 20px}.welcome h1{font-size:36px;margin:14px 0 5px;letter-spacing:-.04em}.welcome p{max-width:520px;margin:auto;color:var(--muted);font-size:12px;line-height:1.6}.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:18px}.btn,.chip,.copy,.retry{border:1px solid var(--line);background:#081019;color:#c9dbe5;border-radius:9px;padding:7px 10px;font-size:11px}.msg{display:flex;gap:7px;margin:9px 0;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:9px;background:#08121b;display:grid;place-items:center}.user .avatar{order:2;background:#1b1227;border-color:#4b3470}.body{max-width:min(88%,760px)}.bubble{border:1px solid var(--line);background:#081019;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.62;overflow-wrap:anywhere}.user .bubble{background:#191126;border-color:#4b3270}.meta{margin:3px 5px;color:#5d7787;font:8px monospace}.actions{display:flex;gap:5px;margin:3px 4px}.copy,.retry{font-size:9px;padding:4px 7px}.md h2{font-size:18px;margin:4px 0 9px}.md h3{font-size:15px;margin:10px 0 6px}.md p{margin:7px 0}.md ul{margin:7px 0 7px 20px;padding:0}.md li{margin:3px 0}.md strong{font-weight:750}.md code{background:#111c25;border:1px solid #243743;border-radius:5px;padding:1px 4px;font-family:ui-monospace,monospace;font-size:.9em}.md pre{margin:9px 0;padding:10px;overflow:auto;border:1px solid #243743;border-radius:9px;background:#050a0f;font:12px/1.5 ui-monospace,monospace}.md blockquote{margin:8px 0;padding:7px 10px;border-left:3px solid var(--cyan);background:#08161f;color:#c9dce5}.work{border:1px solid #27536a;background:#061018f5;border-radius:14px;padding:9px;margin:10px auto;width:min(860px,100%)}.wh{display:flex;justify-content:space-between;color:var(--cyan);font:9px monospace}.digits{text-align:center;font:700 29px ui-monospace,monospace;margin:4px;text-shadow:0 0 14px #39dcff55}.stages{display:flex;gap:4px;overflow:auto}.stages span{white-space:nowrap;border:1px solid #183442;border-radius:7px;padding:4px 6px;color:#567181;font-size:8px}.stages .on{color:#d2fbff;background:#0b2732;border-color:#3e91ab}.note{margin-top:4px;color:#6d8797;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composer-wrap{border-top:1px solid var(--line);background:#05080ddd;padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:6;backdrop-filter:blur(18px)}.composer{width:min(900px,100%);margin:auto;border:1px solid #29475a;border-radius:16px;background:#071019f7;box-shadow:0 -8px 28px #0008}.row{display:flex;gap:6px;align-items:flex-end;padding:6px}.input{flex:1;min-width:0;min-height:42px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px;font-size:16px;line-height:1.35}.input::placeholder{color:#718999}.crown,.send{width:44px;height:44px;flex:none;border-radius:11px}.crown{border:1px solid #684b9c;background:#171026;color:white;font-size:21px}.send{border:1px solid #8fefff;background:#bdf7ff;color:#031018;font-size:20px}.send:disabled{opacity:.45}.under{display:flex;align-items:center;gap:5px;overflow:auto;padding:0 7px 6px}.chip{white-space:nowrap;font-size:9px;padding:4px 7px}.status{margin-left:auto;white-space:nowrap;color:#6f8998;font:8px monospace}.sheet{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:20;padding:15px}.sheet.open{display:grid}.panel{width:min(520px,100%);max-height:90dvh;overflow:auto;border:1px solid #31566c;background:#071019;border-radius:16px;padding:14px}.panel h3{margin:0;color:var(--cyan)}.panel .sub{color:var(--muted);font-size:11px}.deck{display:grid;grid-template-columns:1fr 1fr;gap:6px}.deck button{text-align:left}.key{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:9px}.keyrow{display:flex;gap:5px;margin-top:6px}.keyrow input{flex:1;min-width:0;background:#03070b;border:1px solid var(--line);border-radius:8px;color:white;padding:8px}.keyrow button,.close{border:1px solid #37647c;background:#0b2431;color:#c9f8ff;border-radius:8px;padding:8px}.close{width:100%;margin-top:7px}@media(max-width:520px){.live{display:none}.welcome{padding:8vh 12px}.welcome h1{font-size:30px}.body{max-width:90%}.bubble{font-size:14px}.deck{grid-template-columns:1fr}.chat{padding-left:7px;padding-right:7px}.composer-wrap{padding-left:7px;padding-right:7px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="orb"></div><div>CF BOSS<small>JARVIS LIVING · COMMAND CENTER</small></div></div><div class="grow"></div><div class="live">● ONLINE · AUTO</div><button class="tool" id="tools" aria-label="เครื่องมือ">＋</button></header><main class="chat" id="chat"><div class="stream" id="stream"></div></main><footer class="composer-wrap"><div class="composer"><div class="row"><button class="crown" id="crown" aria-label="เรียก Boss">👑</button><textarea id="chatInput" class="input" rows="1" placeholder="บอกเป้าหมายให้ Boss…" autocomplete="off"></textarea><button id="send" class="send" aria-label="ส่ง">↑</button></div><div class="under"><button class="chip" data-mode="voice">🎙 Voice</button><button class="chip" data-mode="web">🌐 Web</button><button class="chip" data-mode="fleet">🚗 Fleet</button><button class="chip" data-mode="memory">🧠 Memory</button><button class="chip" data-mode="verify">🧪 Verify</button><span class="status" id="status">พร้อม · Auto</span></div></div></footer></div><div class="sheet" id="sheet"><div class="panel"><h3>⚡ BOSS COMMAND DECK</h3><div class="sub">บอสเลือกวิธีทำเอง — คุณบอกแค่เป้าหมาย</div><div class="deck" style="margin-top:10px"><button class="btn" data-q="ตรวจบ้าน CF Boss ทั้งระบบ แล้วหาสิ่งที่ควรแก้">👀 ตรวจบ้าน</button><button class="btn" data-q="ใช้ CodingFleet วางแผนและทำงานนี้ให้ครบ พร้อมตรวจสอบผล">🚗 CodingFleet</button><button class="btn" data-q="ตรวจ Model Router และ provider ที่พร้อมใช้งาน">🧠 Model Router</button><button class="btn" data-q="ตรวจ Tool Registry และหาเครื่องมือที่ควรเพิ่ม">🧰 Tool Registry</button></div><div class="key"><b>🔑 OpenRouter</b><div class="keyrow"><input id="orKey" type="password" placeholder="OpenRouter API key"><button id="save">บันทึก</button></div><small style="color:#718999">เก็บในเครื่องนี้และส่งผ่าน HTTPS เฉพาะ request</small></div><button class="close" id="close">ปิด</button></div></div><script>const $=id=>document.getElementById(id),chat=$('chat'),input=$('chatInput'),send=$('send'),stream=$('stream'),status=$('status'),keyName='cf_openrouter_key';let history=JSON.parse(localStorage.getItem('cf_living_chat')||'[]'),busy=false;function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function md(s){let x=esc(s);x=x.replace(/```([\s\S]*?)```/g,(_,a)=>'<pre>'+a.trim()+'</pre>');x=x.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+x+'</p>'}function work(){return '<div class="work"><div class="wh"><span>👑 BOSS DIGITAL WORKSTATION</span><span id="ws">STANDBY</span></div><div class="digits" id="digits">00.000 s</div><div class="stages"><span>🧠 วิเคราะห์</span><span>🗺️ วางแผน</span><span>⚡ เลือกโมเดล</span><span>🧰 เครื่องมือ</span><span>🔧 ลงมือ</span><span>🧪 ตรวจสอบ</span><span>✅ เสร็จ</span></div><div class="note" id="note">กำลังเตรียมงาน</div></div>'}function stage(n,s){document.querySelectorAll('.stages span').forEach((x,i)=>x.className=i<n?'on':'');if($('ws'))$('ws').textContent=s;if($('note'))$('note').textContent=s}function bind(){document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;$('sheet').classList.remove('open');ask()})}function render(){stream.innerHTML='';if(!history.length){stream.innerHTML='<div class="welcome"><div class="orb" style="width:70px;height:70px;margin:auto"></div><h1>Boss พร้อมครับ 👑</h1><p>บอกเป้าหมายได้เลย Boss จะวิเคราะห์ วางแผน เลือกโมเดล/เครื่องมือ ลงมือ และตรวจสอบผลให้เอง</p><div class="quick"><button class="btn" data-q="ตรวจบ้าน CF Boss ทั้งระบบ แล้วหาสิ่งที่ควรแก้">🔍 ตรวจบ้าน</button><button class="btn" data-q="ปรับหน้าแชทให้ใช้งานง่ายและเร็ว">⚡ ปรับระบบ</button><button class="btn" data-q="ตรวจ Model Router และ provider ที่พร้อมใช้งาน">🧠 ตรวจโมเดล</button><button class="btn" data-q="ทดสอบ CodingFleet ให้หน่อย">🚗 ทดสอบ Fleet</button></div></div>';bind();return}history.forEach((m,i)=>{let e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'bot');e.innerHTML='<div class="avatar">'+(m.role==='user'?'พ':'👑')+'</div><div class="body"><div class="bubble '+(m.role==='assistant'?'md':'')+'">'+(m.role==='assistant'?md(m.content):esc(m.content))+'</div><div class="meta">'+(m.role==='user'?'USER':'BOSS · '+(m.provider||'AUTO'))+'</div>'+(m.role==='assistant'?'<div class="actions"><button class="copy" data-i="'+i+'">📋 คัดลอก</button><button class="retry" data-i="'+i+'">↻ ลองใหม่</button></div>':'')+'</div>';stream.appendChild(e)});document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(history[+b.dataset.i].content);b.textContent='✓ คัดลอกแล้ว';setTimeout(()=>b.textContent='📋 คัดลอก',900)});document.querySelectorAll('.retry').forEach(b=>b.onclick=()=>{let q=history.slice(0,+b.dataset.i).reverse().find(x=>x.role==='user');if(q){input.value=q.content;ask()}});chat.scrollTop=chat.scrollHeight}async function ask(text){if(busy)return;let q=(text||input.value).trim();if(!q)return;busy=true;history.push({role:'user',content:q});localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)));render();input.value='';send.disabled=true;let box=document.createElement('div');box.innerHTML=work();stream.appendChild(box.firstElementChild);let t=performance.now(),timer=setInterval(()=>{if($('digits'))$('digits').textContent=((performance.now()-t)/1000).toFixed(3)+' s'},40);status.textContent='🧠 Boss กำลังทำงาน';try{stage(1,'ANALYZE');stage(2,'PLAN');stage(3,'ROUTE');let key=localStorage.getItem(keyName)||'',ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),60000);let r;try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,body:JSON.stringify({question:q,history:history.slice(0,-1).slice(-18),room:'living',who:'silelo',provider:'auto',model:'',clientKeys:{openrouter:key},opt:{lang:'th',len:'normal',mode:'agent'}})})}finally{clearTimeout(timeout)}stage(4,'TOOLS');stage(5,'VERIFY');let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Boss API ไม่ตอบสนอง');history.push({role:'assistant',content:d.reply||d.message||'บอสได้รับคำตอบว่าง',provider:d.providerLabel||d.provider||'Auto'});localStorage.setItem('cf_living_chat',JSON.stringify(history.slice(-120)));stage(7,'COMPLETE');status.textContent='✅ เสร็จแล้ว · '+(d.providerLabel||'Auto');render()}catch(e){history.push({role:'assistant',content:e.name==='AbortError'?'⏱️ งานใช้เวลานานเกินไป — Boss หยุด request เพื่อไม่ให้หน้าค้าง':'⚠️ '+e.message,provider:'System'});status.textContent='⚠️ ต้องลองใหม่';render()}finally{clearInterval(timer);busy=false;send.disabled=false;input.focus()}}send.onclick=()=>ask();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});$('tools').onclick=()=>$('sheet').classList.add('open');$('close').onclick=()=>$('sheet').classList.remove('open');$('crown').onclick=()=>input.focus();$('save').onclick=()=>{let k=$('orKey').value.trim();if(k.length>10){localStorage.setItem(keyName,k);$('orKey').value='';$('orKey').placeholder='•••••••• บันทึกแล้ว'}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{status.textContent='โหมด '+b.dataset.mode.toUpperCase()+' · พร้อม';input.focus()});render();input.focus()</script></body></html>
