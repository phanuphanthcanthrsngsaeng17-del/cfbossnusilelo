<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f"><meta http-equiv="Cache-Control" content="no-store">
<title>CF Bossnusilelo · Sandbox Room</title>
<style>
:root{--bg:#09090c;--panel:#15151a;--panel2:#1d1d23;--line:#303039;--text:#f6f6f8;--muted:#9999a6;--accent:#a78bfa;--good:#22c55e;--bad:#fb7185;--user:#3a2163}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0b0b0ff5;backdrop-filter:blur(18px);z-index:10}.icon,.tab,.run{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;height:42px;cursor:pointer}.icon{width:42px;font-size:21px}.brand{font-weight:800;font-size:15px;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:3px}.grow{flex:1}.room{height:42px;max-width:170px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);padding:0 10px}.new{width:42px}.tabs{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:#101015;overflow:auto}.tab{height:34px;padding:0 12px;white-space:nowrap;font-size:12px}.tab.on{border-color:var(--accent);background:#272031}.workspace{flex:1;min-height:0;display:flex;flex-direction:column}.chat{flex:1;min-height:190px;overflow:auto;padding:18px 12px 14px}.welcome{text-align:center;color:var(--muted);margin:7vh auto 0;max-width:620px}.logo{width:64px;height:64px;margin:auto;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#be185d);font-size:30px}.welcome h1{color:var(--text);font-size:26px;margin:13px 0 7px}.welcome p{margin:0;line-height:1.6}.msg{display:flex;gap:10px;margin:18px auto;max-width:900px}.msg.user{justify-content:flex-end}.avatar{width:33px;height:33px;border-radius:50%;background:#292932;display:grid;place-items:center;flex:none}.user .avatar{order:2;background:linear-gradient(135deg,#7c3aed,#be185d)}.body{max-width:min(780px,90%)}.bubble{padding:13px 15px;border-radius:17px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#18181d}.user .bubble{background:var(--user);border:1px solid #55328a}.meta{font-size:10px;color:var(--muted);margin:5px}.sandbox{height:46%;min-height:260px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#0e0e13}.bar{display:flex;align-items:center;gap:7px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.bar select,.bar button{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:0 9px}.run{background:#166534!important;border-color:#15803d!important;font-weight:700}.run.busy{opacity:.6}.editorwrap{flex:1;min-height:0;display:flex}.line{width:38px;padding:12px 7px;text-align:right;color:#555;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;border-right:1px solid #22222a;overflow:hidden}.code{flex:1;width:100%;height:100%;resize:none;border:0;outline:0;background:#0b0b0f;color:#e5e7eb;padding:12px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}.result{height:100px;border-top:1px solid var(--line);background:#0a0a0d;padding:8px 11px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.ok{color:#86efac}.err{color:#fda4af}.composer{border-top:1px solid var(--line);padding:7px 10px calc(8px + env(safe-area-inset-bottom));background:#111116}.inputrow{display:flex;gap:7px;max-width:900px;margin:auto;border:1px solid #3a3a44;border-radius:22px;background:#18181d;padding:7px}.input{flex:1;min-height:42px;max-height:130px;background:transparent;border:0;outline:0;color:var(--text);resize:none;padding:9px;line-height:1.5}.send{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px}.tools{max-width:900px;margin:4px auto 0;display:flex;gap:5px;overflow:auto}.tool{border:0;background:transparent;color:var(--muted);padding:5px 9px;white-space:nowrap}.status{font-size:10px;color:var(--muted);max-width:900px;margin:auto;padding:2px 8px}.status.bad{color:var(--bad)}@media(min-width:900px){.workspace{display:grid;grid-template-columns:1fr 1fr}.chat{height:auto;border-right:1px solid var(--line)}.sandbox{height:auto;min-height:0}.composer{position:fixed;left:0;right:0;bottom:0;background:#111116eF;backdrop-filter:blur(15px);z-index:8}.workspace{padding-bottom:112px}.chat{padding-bottom:130px}}
</style>
</head>
<body><div class="app">
<header class="top"><button class="icon" id="menu">☰</button><div class="brand">CF Bossnusilelo<small>Sandbox Room · CodingFleet</small></div><div class="grow"></div><select class="room" id="room"><option value="living">💜 ห้องนั่งเล่น</option><option value="study">🧑‍🏫 ห้องเรียน</option><option value="project">🚀 ห้องโปรเจกต์</option></select><button class="icon new" id="new">＋</button></header>
<div class="tabs"><button class="tab on" data-tab="all">💬 ห้อง + Sandbox</button><button class="tab" data-tab="chat">💬 แชท</button><button class="tab" data-tab="code">🧪 Sandbox</button></div>
<section class="workspace"><main class="chat" id="chat"><div class="welcome" id="welcome"><div class="logo">🧪</div><h1>Sandbox Room</h1><p>ห้องนี้เป็นพื้นที่ทำงานจริง: คุยกับบอส เขียนโค้ด รันโค้ด ดูผล และวนแก้ได้ในที่เดียว</p></div></main>
<section class="sandbox" id="sandbox"><div class="bar"><select id="language"><option>กำลังโหลดภาษา…</option></select><button class="run" id="run">▶ รันโค้ด</button><button id="clearCode">ล้าง</button><button id="askCode">🤖 ให้บอสดูโค้ด</button></div><div class="editorwrap"><div class="line" id="lines">1</div><textarea id="code" class="code" spellcheck="false">print("Hello from CF Sandbox")</textarea></div><div class="result" id="result">ผลการรันจะแสดงตรงนี้…</div></section></section>
<div class="composer"><div class="inputrow"><textarea id="input" class="input" placeholder="บอกบอสว่าอยากทำอะไรกับโค้ดหรือโปรเจกต์…"></textarea><button id="send" class="send">↑</button></div><div class="tools"><button class="tool" id="attach">📎 แนบไฟล์</button><button class="tool" id="toggleSandbox">🧪 Sandbox</button><button class="tool" id="save">💾 บันทึก</button><span class="tool" id="model">🤖 Auto</span></div><div class="status" id="status">พร้อม · โค้ดจะรันใน sandbox แยกจากเว็บ</div></div>
</div>
<script>
const $=id=>document.getElementById(id);const room=$('room'),chat=$('chat'),code=$('code'),lines=$('lines'),result=$('result'),status=$('status'),input=$('input');let langs=[],history=[],busy=false;
const storage=()=>`cf_sandbox_${room.value}`;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadRoom(){const d=JSON.parse(localStorage.getItem(storage())||'{}');history=d.history||[];code.value=d.code||'print("Hello from CF Sandbox")';render();updateLines()}
function saveRoom(){localStorage.setItem(storage(),JSON.stringify({history:history.slice(-60),code:code.value}))}
function render(){chat.innerHTML='';if(!history.length){chat.innerHTML='<div class="welcome"><div class="logo">🧪</div><h1>Sandbox Room</h1><p>คุย + เขียน + รันโค้ดในห้องเดียว</p></div>';return}history.forEach(m=>{const r=document.createElement('div');r.className='msg '+(m.role==='user'?'user':'bot');r.innerHTML=`<div class="avatar">${m.role==='user'?'พ':'🤖'}</div><div class="body"><div class="bubble">${esc(m.content)}</div><div class="meta">${m.role==='user'?'พี่นุ':'บอส'}</div></div>`;chat.appendChild(r)});chat.scrollTop=chat.scrollHeight}
function updateLines(){const n=code.value.split('\n').length;lines.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
async function loadLanguages(){try{const r=await fetch('/api/sandbox');const d=await r.json();langs=d.languages||[];const select=$('language');select.innerHTML='';const seen=new Set();langs.sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(x=>{if(seen.has(x.id))return;seen.add(x.id);const o=document.createElement('option');o.value=x.id;o.textContent=`${x.name} · ${x.id}`;select.appendChild(o)});const py=langs.find(x=>String(x.name).toLowerCase().includes('python'));if(py)select.value=py.id;status.textContent=`พร้อม · ${langs.length} ภาษา · sandbox แยกจากเว็บ`}catch(e){status.textContent='โหลดรายการภาษาไม่สำเร็จ';status.classList.add('bad')}}
async function runCode(){if(busy)return;if(!code.value.trim())return;busy=true;$('run').classList.add('busy');$('run').textContent='⏳ กำลังรัน';result.textContent='กำลังส่งโค้ดเข้า sandbox…';status.textContent='กำลังประมวลผล · CPU 5s · Memory 128MB';try{const r=await fetch('/api/sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:code.value,language_id:Number($('language').value),stdin:''})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sandbox error');const out=[d.stdout,d.stderr,d.compile_output,d.message].filter(Boolean).join('\n');result.className='result '+(d.status?.id===3?'ok':'err');result.textContent=out||`สถานะ: ${d.status?.description||'เสร็จสิ้น'}\nเวลา: ${d.time||'-'}s · memory: ${d.memory||'-'} KB`;status.textContent=`${d.status?.description||'เสร็จแล้ว'} · sandbox`;saveRoom()}catch(e){result.className='result err';result.textContent=e.message||String(e);status.textContent='Sandbox error';status.classList.add('bad')}finally{busy=false;$('run').classList.remove('busy');$('run').textContent='▶ รันโค้ด'}}
async function askBoss(){const q=input.value.trim()||'ช่วยตรวจโค้ดนี้ หาจุดผิดและเสนอวิธีแก้';const prompt=`ทำงานใน CodingFleet Sandbox ห้อง ${room.value}\nคำขอ: ${q}\nภาษา ID: ${$('language').value}\nโค้ด:\n${code.value}`;history.push({role:'user',content:q});render();input.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:prompt,history:history.slice(-12),room:room.value,who:'silelo',provider:'auto',mode:'sandbox'})});const d=await r.json();const answer=d.answer||d.message||d.error||'บอสยังตอบไม่ได้';history.push({role:'assistant',content:answer});saveRoom();render()}catch(e){history.push({role:'assistant',content:'เชื่อมต่อบอสไม่ได้: '+e.message});saveRoom();render()}}
$('run').onclick=runCode;$('askCode').onclick=askBoss;$('send').onclick=askBoss;$('clearCode').onclick=()=>{code.value='';updateLines();saveRoom()};$('save').onclick=()=>{saveRoom();status.textContent='บันทึกห้องแล้ว'};code.addEventListener('input',updateLines);code.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const a=code.selectionStart,b=code.selectionEnd;code.value=code.value.slice(0,a)+'  '+code.value.slice(b);code.selectionStart=code.selectionEnd=a+2;updateLines();saveRoom()}});room.onchange=loadRoom;$('new').onclick=()=>{history=[];code.value='print("New Sandbox Room")';saveRoom();render();updateLines()};$('toggleSandbox').onclick=()=>{$('sandbox').scrollIntoView({behavior:'smooth'})};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');if(t.dataset.tab==='chat')$('chat').scrollIntoView({behavior:'smooth'});if(t.dataset.tab==='code')$('sandbox').scrollIntoView({behavior:'smooth'})});loadRoom();loadLanguages();
</script></body></html>
